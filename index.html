  // ------------------------------------------------------------ Profil
  function gangDomain() {
    const g = [];
    for (const c of state.ds.chars) {
      if (c.cls.group === 'bcd' && c.cls.gang != null) g.push(c.cls.gang);
      if (c.cls.group === 'lead' && c.cls.from != null) g.push(c.cls.from, c.cls.to);
    }
    return g.length ? [Math.min(...g) - 0.6, Math.max(...g) + 0.6] : [0, 1];
  }

  function renderProfile() {
    const sec = $('profileSec'), ds = state.ds, u = selUnit();
    const sm = u.summary, b = sm.bcd, l = sm.lead;
    const hasBcd = ds.chars.some((c) => c.cls.group === 'bcd'), hasLead = ds.chars.some((c) => c.cls.group === 'lead' && c.cls.from != null && c.nominal > 0);
    const nut = ds.partType === 'mutter';
    const head = h('div', { class: 'sec-head' }, h('div', null, h('h2', { text: `${PART[ds.partType].label}-Steckbrief` }), h('p', { class: 'sub', text: unitTitle(u) })));
    if (!hasBcd && !hasLead) {
      sec.replaceChildren(head, h('p', { class: 'empty', text: `In diesen Daten wurden keine BCD- oder Steigungsmerkmale erkannt. Ist das ein ${PART[ds.partType].label}-Export? Siehe Merkmalszuordnung im Einlesebericht.` }));
      return;
    }
    if (u.pooled && !state.res.nIncluded) {
      sec.replaceChildren(head, h('p', { class: 'empty', text: 'Kein Fertigungsauftrag einbezogen.' }));
      return;
    }
    const nomP = l.nominalPitch;
    const posWord = nut ? 'KR' : 'Gänge';
    // kürzeste Fensterlänge, wenn sie von der Hauptlänge abweicht (Mutter: KR1–KR2 und KR3–KR4 mit je 2,9 mm)
    const minLen = l.windows.length ? Math.min(...l.windows.map((w) => w.length)) : null;
    const singles = minLen != null && minLen < (l.mainLength ?? 0) ? l.windows.filter((w) => Math.abs(w.length - minLen) < 1e-9).map((w) => Object.assign({}, w, { pitch: w.stats.mean })) : [];
    let leadTile;
    if (l.spread != null) {
      leadTile = tile('Steigung zwischen Fenstern', `${fmt(um(l.spread), 1)} µm`, `Spanne der ${l.mainCount} Fenstermittel (Länge über ${l.mainTurns} Gänge)`);
    } else if (singles.length > 1) {
      const ps = singles.map((w) => w.pitch);
      leadTile = tile('Steigung der Einzelfenster', `${fmt(um(Math.max(...ps) - Math.min(...ps)), 1)} µm`, `Spanne ${singles.map((w) => w.char.cls.label.replace('Steigung ', '')).join(' vs. ')} (je ${fmt(singles[0].length, 1)} mm)`);
    } else {
      leadTile = tile('Steigung zwischen Fenstern', '–', l.windows.length ? 'nur ein Steigungsfenster' : 'keine Steigungsfenster mit bekannter Gangzahl');
    }
    const ov = b.overall || {};
    const tiles = h('div', { class: 'tiles' },
      tile('BCD Gauss x̄', b.gaussMean != null ? `${fmt(b.gaussMean, 4)} mm` : '–', b.gaussMean != null && b.nominal != null ? `${fmtS(um(b.gaussMean - b.nominal), 1)} µm zum Nennmaß ${fmt(b.nominal, 3)}${b.gaussFromOverall ? ` · Zylinder ${ov.gauss.char.position}` : ''} · ${plWert(b.gaussN)}` : null),
      tile(`BCD-Verlauf über ${posWord}`, b.profileRange != null ? `${fmt(um(b.profileRange), 1)} µm` : '–', `Spanne der ${nut ? 'KR' : 'Gang'}-Mittelwerte (Gauss)`),
      tile('Hüll − Pferch x̄', b.formMean != null ? `${fmt(um(b.formMean), 1)} µm` : '–', b.formN ? `Mittel über ${b.formN} ${posWord}${b.formOverall != null ? ` · Zylinder gesamt ${fmt(um(b.formOverall), 1)} µm` : ''}` : null),
      l.pitchMean != null
        ? tile('Steigung p̄', `${fmt(l.pitchMean, 5)} mm`, nomP != null ? `${fmtS(um(l.pitchMean - nomP), 2)} µm je Gang · Nenn ${fmt(nomP, 3)} · aus ${l.mainCount > 1 ? `${l.mainCount} Fenstern` : 'dem Fenster'} über ${l.mainTurns} Gänge` : null)
        : tile(l.mainLabel || 'Steigung', l.mainMean != null ? `${fmt(l.mainMean, 4)} mm` : '–', l.mainMean != null ? `${fmtS(um(l.mainMean - l.mainLength), 1)} µm zur Nennlänge ${fmt(l.mainLength, 3)} mm` : null),
      leadTile,
      tile('Werte außerhalb Toleranz', String(sm.oot), sm.oot ? `in ${sm.ootChars.length} BCD-/Steigungsmerkmal(en)` : 'alle BCD- und Steigungswerte in Toleranz', sm.oot > 0),
    );

    const bcdBox = h('div', { class: 'chartbox' });
    const leadBox = h('div', { class: 'chartbox' });
    const legendBtn = (key, glyph, label) => h('button', {
      class: 'lg', type: 'button', 'aria-pressed': String(state.show[key]),
      onclick: () => { state.show[key] = !state.show[key]; renderProfile(); },
    }, glyph, h('span', { class: 't', text: label }));
    const charts = h('div', { class: 'charts' });
    if (hasBcd) {
      const hasHP = ds.chars.some((c) => c.cls.fit === 'huell' || c.cls.fit === 'pferch');
      charts.append(h('div', null,
        h('div', { class: 'chart-title' }, h('h3', { text: nut ? 'BCD über die Kugelrillen (KR)' : 'BCD über Gang' }), h('span', { class: 'muted', text: `Abweichung von ${fmt(b.nominal ?? ds.chars.find((c) => c.cls.group === 'bcd').nominal, 3)} mm in µm${nut && ds.krGeometryDerived ? ' · KR an ihrer Lage in Gängen' : ''}` })),
        h('div', { class: 'legend' },
          legendBtn('gauss', glyph('gauss'), 'Gauss x̄ · Min–Max'),
          hasHP ? legendBtn('huell', glyph('huell'), 'Hüll x̄') : null,
          hasHP ? legendBtn('pferch', glyph('pferch'), 'Pferch x̄') : null,
          legendBtn('ctx', glyph('ctx'), u.pooled ? 'einzelne Aufträge (Gauss x̄)' : 'andere Aufträge (Gauss x̄)'),
          h('span', { class: 'lg static' }, glyph('band'), h('span', { class: 't', text: 'Toleranz Gauss' })),
          hasHP ? h('span', { class: 'lg static' }, glyph('tol2'), h('span', { class: 't', text: 'Toleranz Hüll/Pferch' })) : null,
          b.overall && b.overall.gauss ? h('span', { class: 'lg static' }, glyph('overall'), h('span', { class: 't', text: 'Zylinder gesamt (Gauss x̄)' })) : null),
        bcdBox));
    }
    if (hasLead) {
      const leads = ds.chars.filter((c) => c.cls.group === 'lead' && c.cls.from != null && c.nominal > 0);
      const w0 = leads[0];
      const sameTurns = leads.every((c) => c.cls.turns && c.cls.turns === w0.cls.turns && c.nominal === w0.nominal);
      charts.append(h('div', null,
        h('div', { class: 'chart-title' }, h('h3', { text: 'Steigung über Gewindelänge' }), h('span', { class: 'muted', text: sameTurns ? `Längenabweichung je Fenster über ${plGang(w0.cls.turns)} vom Nennmaß ${fmt(w0.nominal, 3)} mm in µm` : `Längenabweichung je Fenster von der jeweiligen Nennlänge in µm (${leads.map((c) => `${c.cls.label.replace('Steigung ', '')}: ${fmt(c.nominal, 1)} mm`).join(', ')})` })),
        h('div', { class: 'legend' },
          h('span', { class: 'lg static' }, glyph('gauss'), h('span', { class: 't', text: 'Fenster x̄ · Min–Max' })),
          state.show.ctx ? h('span', { class: 'lg static' }, glyph('ctx'), h('span', { class: 't', text: u.pooled ? 'einzelne Aufträge' : 'andere Aufträge' })) : null,
          h('span', { class: 'lg static' }, glyph('band'), h('span', { class: 't', text: 'Toleranz' }))),
        leadBox));
    }
    sec.replaceChildren(head, tiles, charts, h('p', { class: 'note', text: `Tipp: Mit der Maus über die Diagramme fahren oder ein Diagramm anklicken und mit ← → durch die ${nut ? 'Kugelrillen' : 'Gänge'} gehen. Alle Werte stehen auch in der Kennwert-Tabelle unten.${nut && ds.krGeometryDerived ? ' Die Lage der KR in Gängen ist aus den Nennmaßen der Steigungsfenster abgeleitet.' : ''}` }));
    if (hasBcd) drawBcd(bcdBox, u);
    if (hasLead) drawLead(leadBox, u);
  }

  /** Legenden-Symbol (Mark-Spiegel). */
  function glyph(kind) {
    const g = s('svg', { width: 18, height: 12, viewBox: '0 0 18 12', 'aria-hidden': 'true', class: 'glyph' });
    if (kind === 'gauss') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--s1)', 'stroke-width': 2 }, g); s('circle', { cx: 9, cy: 6, r: 3.5, fill: 'var(--s1)' }, g); }
    else if (kind === 'huell') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--s2)', 'stroke-width': 1.5 }, g); s('path', { d: triPath(9, 6, 4.5, true), fill: 'var(--s2)' }, g); }
    else if (kind === 'pferch') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--s3)', 'stroke-width': 1.5 }, g); s('path', { d: triPath(9, 6, 4.5, false), fill: 'var(--s3)' }, g); }
    else if (kind === 'ctx') s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--ctx)', 'stroke-width': 1.5 }, g);
    else if (kind === 'band') { s('rect', { x: 1, y: 2, width: 16, height: 8, fill: 'var(--tolband)' }, g); s('line', { x1: 1, x2: 17, y1: 2, y2: 2, class: 'tolline' }, g); s('line', { x1: 1, x2: 17, y1: 10, y2: 10, class: 'tolline' }, g); }
    else if (kind === 'tol2') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, class: 'tolline2' }, g); }
    else if (kind === 'overall') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--s1)', 'stroke-width': 1.5, 'stroke-dasharray': '5 3' }, g); }
    return g;
  }
  function triPath(cx, cy, r, up) {
    const k = up ? 1 : -1;
    return `M${cx},${cy - k * r}L${cx + r * 0.95},${cy + k * r * 0.65}L${cx - r * 0.95},${cy + k * r * 0.65}Z`;
  }

  // ------------------------------------------------------------ Diagramm-Grundlagen
  function lin(d0, d1, r0, r1) { const k = (r1 - r0) / (d1 - d0 || 1); const f = (v) => r0 + (v - d0) * k; f.inv = (p) => d0 + (p - r0) / k; return f; }
  function niceStep(span, count) {
    const raw = span / Math.max(1, count), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }
  function niceDomain(vals, count) {
    let min = Math.min(...vals), max = Math.max(...vals);
    if (!isFinite(min)) { min = 0; max = 1; }
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.05; min -= pad; max += pad;
    const st = niceStep(max - min, count);
    const d = [Math.floor(min / st + 1e-9) * st, Math.ceil(max / st - 1e-9) * st];
    const t = [];
    for (let v = d[0]; v <= d[1] + st * 1e-6; v += st) t.push(+v.toFixed(10));
    return { domain: d, ticks: t, step: st };
  }
  function decimalsForStep(st) {
    let d = 0;
    while (d < 8 && Math.abs(Math.round(st * Math.pow(10, d)) - st * Math.pow(10, d)) > 1e-6) d++;
    return d;
  }

  /** Skalierung gegenüber 14 px Grundschrift (Full HD 15 px, 4K 17–20 px) – Diagramm-Geometrie wächst mit. */
  function rootScale() { return (parseFloat(getComputedStyle(document.documentElement).fontSize) || 14) / 14; }
  const isWide = () => window.matchMedia('(min-width:1600px)').matches;
  /** Diagrammhöhe: auf großen Bildschirmen an die Fensterhöhe angelehnt, damit Diagramme nicht flach wirken. */
  function chartHeight(base) {
    const k = rootScale();
    if (!isWide()) return Math.round(base * k);
    return Math.round(Math.max(base * k, Math.min(window.innerHeight * 0.44, base * k * 1.7)));
  }

  function frame(host, o) {
    const k = rootScale();
    const W = Math.max(300, Math.floor(host.clientWidth || 640)), H = o.height || 300;
    const m = { l: (o.ml || 48) * k, r: 14 * k, t: 12 * k, b: (o.mb || 34) * k };
    const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': o.aria, tabindex: 0 });
    host.replaceChildren(svg);
    const x = lin(o.x[0], o.x[1], m.l, W - m.r), y = lin(o.y[0], o.y[1], H - m.b, m.t);
    const grid = s('g', { class: 'grid' }, svg);
    for (const t of o.yTicks) {
      s('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }, grid);
      s('text', { x: m.l - 8 * k, y: y(t), 'text-anchor': 'end', 'dominant-baseline': 'middle', class: 'tick' }, svg).textContent = o.yFmt(t);
    }
    s('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis' }, svg);
    for (const t of o.xTicks || []) {
      s('line', { x1: x(t.v), x2: x(t.v), y1: H - m.b, y2: H - m.b + 4 * k, class: 'axis' }, svg);
      s('text', { x: x(t.v), y: H - m.b + 16 * k, 'text-anchor': 'middle', class: 'tick' }, svg).textContent = t.label;
    }
    if (o.xTitle) s('text', { x: m.l, y: H - m.b + 16 * k, 'text-anchor': 'end', dx: -8 * k, class: 'tick' }, svg).textContent = o.xTitle;
    const plot = s('g', null, svg);
    return { svg, plot, x, y, W, H, m, k };
  }

  // Tooltip
  const tip = $('tip');
  function showTip(node, pt) {
    tip.replaceChildren(node);
    tip.hidden = false;
    const r = tip.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    let left = pt.x + 14, top = pt.y + 14;
    if (left + r.width > vw - 8) left = pt.x - r.width - 14;
    if (left < 8) left = 8;
    if (top + r.height > vh - 8) top = pt.y - r.height - 14;
    if (top < 8) top = 8;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  function hideTip() { tip.hidden = true; }
  function tipBox(title, rows, foot) {
    return h('div', null, h('div', { class: 'tip-title', text: title }),
      rows.filter(Boolean).map((r) => h('div', { class: 'tip-row' }, h('span', { class: 'lk ' + (r.key ? 'k-' + r.key : 'none') }), h('strong', { text: r.value }), h('span', { class: 'tip-label', text: r.label }))),
      foot ? [].concat(foot).filter(Boolean).map((f) => h('div', { class: 'tip-foot', text: f })) : null);
  }

  /** Fadenkreuz: rastet auf die nächste Position ein; Tastatur ← → und Esc. */
  function crosshair(f, points, build, onPick) {
    const line = s('line', { class: 'cross', y1: f.m.t, y2: f.H - f.m.b, visibility: 'hidden' }, f.svg);
    const hit = s('rect', { x: f.m.l, y: 0, width: f.W - f.m.l - f.m.r, height: f.H, fill: 'transparent', style: onPick ? 'cursor:pointer' : null }, f.svg);
    let cur = -1;
    const nearest = (clientX) => {
      const px = clientX - f.svg.getBoundingClientRect().left;
      let best = 0, bd = Infinity;
      points.forEach((p, i) => { const d = Math.abs(p.x - px); if (d < bd) { bd = d; best = i; } });
      return best;
    };
    const show = (i, pt) => {
      cur = i;
      const p = points[i];
      line.setAttribute('x1', p.x); line.setAttribute('x2', p.x); line.setAttribute('visibility', 'visible');
      const r = f.svg.getBoundingClientRect();
      showTip(build(i), pt || { x: r.left + p.x, y: r.top + f.m.t + 24 * f.k });
    };
    const hide = () => { cur = -1; line.setAttribute('visibility', 'hidden'); hideTip(); };
    hit.addEventListener('pointermove', (e) => show(nearest(e.clientX), { x: e.clientX, y: e.clientY }));
    hit.addEventListener('pointerdown', (e) => show(nearest(e.clientX), { x: e.clientX, y: e.clientY }));
    hit.addEventListener('pointerleave', hide);
    if (onPick) hit.addEventListener('click', (e) => onPick(nearest(e.clientX)));
    f.svg.addEventListener('keydown', (e) => {
      const n = points.length;
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); show(cur < 0 ? 0 : (cur + (e.key === 'ArrowRight' ? 1 : n - 1)) % n); }
      else if (e.key === 'Escape') hide();
      else if ((e.key === 'Enter' || e.key === ' ') && onPick && cur >= 0) { e.preventDefault(); onPick(cur); }
    });
    f.svg.addEventListener('focus', () => show(cur < 0 ? 0 : cur));
    f.svg.addEventListener('blur', hide);
  }

  /** Stufenlinie einer Toleranzgrenze über die Gänge (Wechsel jeweils mittig zwischen zwei Gängen). */
  function stepSegments(arr, key, xd) {
    const segs = [];
    arr.forEach((t, i) => {
      const v = t[key];
      if (v == null) return;
      const a = i === 0 ? xd[0] : (arr[i - 1].gang + t.gang) / 2;
      const b = i === arr.length - 1 ? xd[1] : (t.gang + arr[i + 1].gang) / 2;
      segs.push({ a, b, v });
    });
    return segs;
  }
  function stepPathD(f, segs, U) {
    let d = '', prev = null;
    for (const sg of segs) {
      const ya = f.y(U(sg.v));
      d += (prev && Math.abs(prev.b - sg.a) < 1e-9 ? `L${f.x(sg.a)},${ya}` : `M${f.x(sg.a)},${ya}`) + `L${f.x(sg.b)},${ya}`;
      prev = sg;
    }
    return d;
  }

  // ------------------------------------------------------------ BCD-Diagramm
  function drawBcd(host, u) {
    const ds = state.ds, res = state.res, show = state.show;
    const catB = ds.chars.filter((c) => c.cls.group === 'bcd' && c.cls.gang != null);
    if (!catB.length) { host.replaceChildren(h('p', { class: 'empty', text: 'Keine BCD-Werte je Gang/KR.' })); return; }
    const overallG = u.summary.bcd.overall && u.summary.bcd.overall.gauss;
    const nominal = u.summary.bcd.nominal ?? catB.find((c) => c.cls.fit === 'gauss')?.nominal ?? catB[0].nominal ?? 0;
    const U = (v) => (v - nominal) * 1000;
    const xd = gangDomain();
    const gangs = [...new Set(catB.map((c) => c.cls.gang))].sort((a, b) => a - b);
    const tol = {};
    for (const fit of FITS) {
      const arr = catB.filter((c) => c.cls.fit === fit).map((c) => ({ gang: c.cls.gang, lsl: c.lsl, usl: c.usl })).sort((a, b) => a.gang - b.gang);
      if (arr.length) tol[fit] = arr;
    }
    const profile = u.summary.bcd.profile;
    const others = show.ctx ? res.order.map((o) => res.units.get(o)).filter((x) => x.included && x.id !== u.id) : [];

    const ys = [0];
    const pushTol = (arr) => arr && arr.forEach((t) => { if (t.lsl != null) ys.push(U(t.lsl)); if (t.usl != null) ys.push(U(t.usl)); });
    if (show.gauss) pushTol(tol.gauss);
    if (show.huell) pushTol(tol.huell);
    if (show.pferch) pushTol(tol.pferch);
    for (const g of profile) {
      if (show.gauss && g.gauss) ys.push(U(g.gauss.stats.min), U(g.gauss.stats.max));
      if (show.huell && g.huell) ys.push(U(g.huell.stats.mean));
      if (show.pferch && g.pferch) ys.push(U(g.pferch.stats.mean));
    }
    for (const o of others) for (const g of o.summary.bcd.profile) if (g.gauss) ys.push(U(g.gauss.stats.mean));
    if (overallG && show.gauss) ys.push(U(overallG.stats.mean));
    const yd = niceDomain(ys, 7);
    const dd = decimalsForStep(yd.step);
    const f = frame(host, {
      height: chartHeight(330), x: xd, y: yd.domain, yTicks: yd.ticks, yFmt: (v) => fmtS(v, dd),
      xTicks: gangs.map((g) => ({ v: g, label: posLabel(g) })), xTitle: isNut() ? '' : 'Gang',
      aria: `BCD über ${isNut() ? 'Kugelrillen' : 'Gang'}, ${unitTitle(u)}`,
    });
    const P = f.plot, k = f.k;

    // Toleranz
    if (tol.gauss && show.gauss) {
      const lo = stepSegments(tol.gauss, 'lsl', xd), hi = stepSegments(tol.gauss, 'usl', xd);
      if (lo.length === tol.gauss.length && hi.length === tol.gauss.length) {
        let d = '';
        hi.forEach((sg, i) => { d += `${i ? 'L' : 'M'}${f.x(sg.a)},${f.y(U(sg.v))}L${f.x(sg.b)},${f.y(U(sg.v))}`; });
        for (let i = lo.length - 1; i >= 0; i--) d += `L${f.x(lo[i].b)},${f.y(U(lo[i].v))}L${f.x(lo[i].a)},${f.y(U(lo[i].v))}`;
        s('path', { d: d + 'Z', class: 'tolband' }, P);
      }
      s('path', { d: stepPathD(f, lo, U), class: 'tolline' }, P);
      s('path', { d: stepPathD(f, hi, U), class: 'tolline' }, P);
    }
    const hpTol = [];
    if (show.huell && tol.huell) hpTol.push(tol.huell);
    if (show.pferch && tol.pferch && !(tol.huell && show.huell && JSON.stringify(tol.huell.map((t) => [t.lsl, t.usl])) === JSON.stringify(tol.pferch.map((t) => [t.lsl, t.usl])))) hpTol.push(tol.pferch);
    for (const arr of hpTol) for (const key of ['lsl', 'usl']) s('path', { d: stepPathD(f, stepSegments(arr, key, xd), U), class: 'tolline2' }, P);
    s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: f.y(0), y2: f.y(0), class: 'zero' }, P);
    if (overallG && show.gauss) {
      const Y = f.y(U(overallG.stats.mean));
      s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: Y, y2: Y, stroke: 'var(--s1)', 'stroke-width': 1.5 * k, 'stroke-dasharray': `${6 * k} ${4 * k}`, opacity: 0.8 }, P);
    }

    // Kontext: andere Aufträge
    for (const o of others) {
      const pts = o.summary.bcd.profile.filter((g) => g.gauss).map((g) => `${f.x(g.gang)},${f.y(U(g.gauss.stats.mean))}`);
      if (pts.length > 1) s('polyline', { points: pts.join(' '), fill: 'none', stroke: 'var(--ctx)', 'stroke-width': 1.5 * k, 'stroke-linejoin': 'round' }, P);
    }
    // Hüll / Pferch
    const fitStyle = { huell: { color: 'var(--s2)', up: true }, pferch: { color: 'var(--s3)', up: false } };
    for (const fit of ['huell', 'pferch']) {
      if (!show[fit]) continue;
      const pts = profile.filter((g) => g[fit]);
      if (pts.length > 1) s('polyline', { points: pts.map((g) => `${f.x(g.gang)},${f.y(U(g[fit].stats.mean))}`).join(' '), fill: 'none', stroke: fitStyle[fit].color, 'stroke-width': 1.5 * k, 'stroke-linejoin': 'round', 'stroke-opacity': 0.85 }, P);
      for (const g of pts) s('path', { d: triPath(f.x(g.gang), f.y(U(g[fit].stats.mean)), 5.5 * k, fitStyle[fit].up), fill: fitStyle[fit].color, stroke: 'var(--surface)', 'stroke-width': 2, 'paint-order': 'stroke' }, P);
    }
    // Gauss
    if (show.gauss) {
      const pts = profile.filter((g) => g.gauss);
      for (const g of pts) {
        const X = f.x(g.gang), y1 = f.y(U(g.gauss.stats.min)), y2 = f.y(U(g.gauss.stats.max));
        s('line', { x1: X, x2: X, y1, y2, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
        s('line', { x1: X - 4 * k, x2: X + 4 * k, y1, y2: y1, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
        s('line', { x1: X - 4 * k, x2: X + 4 * k, y1: y2, y2, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
      }
      if (pts.length > 1) s('polyline', { points: pts.map((g) => `${f.x(g.gang)},${f.y(U(g.gauss.stats.mean))}`).join(' '), fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2 * k, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, P);
      for (const g of pts) s('circle', { cx: f.x(g.gang), cy: f.y(U(g.gauss.stats.mean)), r: 4.5 * k, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }, P);
    }

    // Fadenkreuz
    const byGang = new Map(profile.map((g) => [g.gang, g]));
    const pts = gangs.filter((g) => byGang.has(g));
    crosshair(f, pts.map((g) => ({ x: f.x(g) })), (i) => {
      const g = byGang.get(pts[i]);
      const rows = [], foot = [];
      for (const fit of FITS) {
        const e = g[fit];
        if (!e) continue;
        const st = e.stats, d = dp(e.char);
        rows.push({ key: fit, value: `${fmtS(U(st.mean), 1)} µm`, label: `${C.FIT_LABEL[fit]} x̄ ${fmt(st.mean, Math.min(d + 1, 4))} · ${fmt(st.min, d)}–${fmt(st.max, d)}` });
        foot.push(`${C.FIT_LABEL[fit]} ${e.char.position}: Tol. ${tolText(e.char, d)} · n = ${st.n}${st.below + st.above ? ` · ⚠ ${st.below + st.above} außerhalb` : ''}`);
      }
      if (overallG) foot.push(`Zylinder gesamt ${overallG.char.position}: Gauss x̄ ${fmt(overallG.stats.mean, Math.min(dp(overallG.char) + 1, 4))} (${fmtS(U(overallG.stats.mean), 1)} µm)`);
      return tipBox(posLabel(g.gang, true), rows, foot);
    });
  }

  // ------------------------------------------------------------ Steigungs-Diagramm
  function drawLead(host, u) {
    const ds = state.ds, res = state.res;
    const catL = ds.chars.filter((c) => c.cls.group === 'lead' && c.cls.from != null && c.nominal > 0).sort((a, b) => a.cls.from - b.cls.from || b.nominal - a.nominal);
    const xd = gangDomain();
    const U = (v, c) => (v - (c.nominal ?? 0)) * 1000;
    const wins = u.summary.lead.windows;
    const others = state.show.ctx ? res.order.map((o) => res.units.get(o)).filter((x) => x.included && x.id !== u.id) : [];
    const ys = [0];
    for (const c of catL) { if (c.lsl != null) ys.push(U(c.lsl, c)); if (c.usl != null) ys.push(U(c.usl, c)); }
    for (const w of wins) ys.push(U(w.stats.min, w.char), U(w.stats.max, w.char));
    for (const o of others) for (const w of o.summary.lead.windows) ys.push(U(w.stats.mean, w.char));
    const yd = niceDomain(ys, 6), dd = decimalsForStep(yd.step);
    const bounds = [...new Set(catL.flatMap((c) => [c.cls.from, c.cls.to]))].sort((a, b) => a - b);
    const f = frame(host, {
      height: chartHeight(isWide() ? 330 : 260), x: xd, y: yd.domain, yTicks: yd.ticks, yFmt: (v) => fmtS(v, dd),
      xTicks: bounds.map((g) => ({ v: g, label: posLabel(g) })), xTitle: isNut() ? '' : 'Gang',
      aria: `Steigung über Gewindelänge, ${unitTitle(u)}`,
    });
    const P = f.plot, k = f.k;
    const tolKey = (c) => `${c.lsl == null ? '' : U(c.lsl, c).toFixed(3)}|${c.usl == null ? '' : U(c.usl, c).toFixed(3)}`;
    const same = new Set(catL.map(tolKey)).size === 1;
    if (same) {
      const c = catL[0], a = f.x(Math.min(...catL.map((k) => k.cls.from))), b = f.x(Math.max(...catL.map((k) => k.cls.to)));
      if (c.lsl != null && c.usl != null) s('rect', { x: a, width: b - a, y: f.y(U(c.usl, c)), height: f.y(U(c.lsl, c)) - f.y(U(c.usl, c)), class: 'tolband' }, P);
      for (const v of [c.lsl, c.usl]) if (v != null) s('line', { x1: a, x2: b, y1: f.y(U(v, c)), y2: f.y(U(v, c)), class: 'tolline' }, P);
    } else {
      for (const c of catL) for (const v of [c.lsl, c.usl]) if (v != null) s('line', { x1: f.x(c.cls.from), x2: f.x(c.cls.to), y1: f.y(U(v, c)), y2: f.y(U(v, c)), class: 'tolline' }, P);
    }
    s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: f.y(0), y2: f.y(0), class: 'zero' }, P);
    for (const o of others) for (const w of o.summary.lead.windows) {
      const Y = f.y(U(w.stats.mean, w.char));
      s('line', { x1: f.x(w.from), x2: f.x(w.to), y1: Y, y2: Y, stroke: 'var(--ctx)', 'stroke-width': 1.5 * k, 'stroke-linecap': 'round' }, P);
    }
    for (const w of wins) {
      const Y = f.y(U(w.stats.mean, w.char)), mid = f.x((w.from + w.to) / 2);
      s('line', { x1: f.x(w.from), x2: f.x(w.to), y1: Y, y2: Y, stroke: 'var(--s1)', 'stroke-width': 2 * k, 'stroke-linecap': 'round' }, P);
      const y1 = f.y(U(w.stats.min, w.char)), y2 = f.y(U(w.stats.max, w.char));
      s('line', { x1: mid, x2: mid, y1, y2, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
      s('line', { x1: mid - 4 * k, x2: mid + 4 * k, y1, y2: y1, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
      s('line', { x1: mid - 4 * k, x2: mid + 4 * k, y1: y2, y2, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
      s('circle', { cx: mid, cy: Y, r: 4.5 * k, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }, P);
    }
    if (!wins.length) return;
    crosshair(f, wins.map((w) => ({ x: f.x((w.from + w.to) / 2) })), (i) => {
      const w = wins[i], st = w.stats, c = w.char, d = dp(c);
      return tipBox(`${c.cls.label} · ${w.turns ? plGang(w.turns) : `Nennlänge ${fmt(c.nominal, 1)} mm`}`, [
        { key: 'gauss', value: `${fmtS(U(st.mean, c), 1)} µm`, label: `Länge x̄ ${fmt(st.mean, Math.min(d + 1, 4))} mm` },
        w.pitch != null ? { value: `${fmt(w.pitch, 5)} mm`, label: `Steigung je Gang${w.nominalPitch != null ? ` (Nenn ${fmt(w.nominalPitch, 3)})` : ''}` } : null,
        { value: `${fmt(st.min, d)}–${fmt(st.max, d)}`, label: `Min–Max · s = ${fmt(st.sd, Math.min(d + 1, 4))}` },
      ], `${c.position}: Tol. ${tolText(c, d)} · n = ${st.n}${st.below + st.above ? ` · ⚠ ${st.below + st.above} außerhalb` : ''}`);
    });
  }

  // ------------------------------------------------------------ Batch-Vergleich
  function renderCompare() {
    const sec = $('compareSec'), ds = state.ds;
    const gl = Object.fromEntries(C.GROUPS.map((g) => [g.id, g.label]));
    const sel = h('select', { 'aria-label': 'Merkmal', onchange: (e) => { state.cmp = e.target.value; renderCompare(); } });
    let og = null, ogId = null;
    for (const c of ds.charsGrouped) {
      if (c.cls.sub !== ogId) { og = h('optgroup', { label: gl[c.cls.sub] }); sel.append(og); ogId = c.cls.sub; }
      const o = h('option', { value: c.position, text: `${c.cls.label} (${c.position})` });
      if (c.position === state.cmp) o.selected = true;
      og.append(o);
    }
    const box = h('div', { class: 'chartbox' });
    const c = ds.charMap.get(state.cmp);
    sec.replaceChildren(
      h('div', { class: 'sec-head' },
        h('div', null, h('h2', { text: 'Merkmal im Auftragsvergleich' }), h('p', { class: 'sub', text: 'Alle Einzelwerte je einbezogenem Fertigungsauftrag, Querstrich = Mittelwert. Spalte anklicken = Auftrag auswählen.' })),
        h('div', { class: 'toolbar' }, sel)),
      c ? h('div', { class: 'legend' },
        h('span', { class: 'lg static' }, h('span', { class: 't', text: `${c.cls.label} · ${c.charText} ${c.position} · ${c.unit} · Tol. ${tolText(c, dp(c))}` }))) : null,
      box);
    if (c) drawCompare(box, c);
  }

  function drawCompare(host, c) {
    const res = state.res;
    const units = res.order.map((o) => res.units.get(o)).filter((u) => u.included && u.chars.get(c.position));
    if (!units.length) { host.replaceChildren(h('p', { class: 'empty', text: 'Keine Werte in den einbezogenen Aufträgen.' })); return; }
    const d = dp(c);
    const ys = units.flatMap((u) => u.chars.get(c.position).values);
    if (c.lsl != null) ys.push(c.lsl);
    if (c.usl != null) ys.push(c.usl);
    if (c.lsl == null && c.nominal === 0) ys.push(0);
    const yd = niceDomain(ys, 6);
    const W = Math.max(300, Math.floor(host.clientWidth || 640)), k0 = rootScale();
    const bandW = (W - (62 + 14) * k0) / units.length;
    const rotate = bandW < 70 * k0;
    const f = frame(host, {
      height: chartHeight(rotate ? 330 : 300), ml: 62, mb: rotate ? 72 : 34, x: [0, units.length], y: yd.domain, yTicks: yd.ticks,
      yFmt: (v) => fmt(v, Math.max(decimalsForStep(yd.step), 0)), aria: `${c.cls.label} im Auftragsvergleich`,
    });
    const P = f.plot, k = f.k, cx = (i) => f.x(i + 0.5);
    units.forEach((u, i) => {
      if (state.sel === u.id) s('rect', { x: f.x(i) + 1, width: f.x(i + 1) - f.x(i) - 2, y: f.m.t, height: f.H - f.m.t - f.m.b, fill: 'var(--selwash)', rx: 4 * k }, P);
      const tx = s('text', { class: 'tick', x: cx(i), y: f.H - f.m.b + 16 * k, 'text-anchor': rotate ? 'end' : 'middle', transform: rotate ? `rotate(-40 ${cx(i)} ${f.H - f.m.b + 12 * k})` : null }, f.svg);
      tx.textContent = u.id;
    });
    for (const [v, lab] of [[c.lsl, 'UGW'], [c.usl, 'OGW']]) {
      if (v == null) continue;
      s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: f.y(v), y2: f.y(v), class: 'tolline' }, P);
      s('text', { class: 'ann', x: f.W - f.m.r - 2 * k, y: f.y(v) - 4 * k, 'text-anchor': 'end' }, P).textContent = `${lab} ${fmt(v, d)}`;
    }
    if (c.lsl != null && c.usl != null && c.nominal != null) {
      s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: f.y(c.nominal), y2: f.y(c.nominal), class: 'axis' }, P);
    }
    units.forEach((u, i) => {
      const st = u.chars.get(c.position);
      const hi = state.sel === 'ALL' || state.sel === u.id;
      const spread = Math.min(bandW * 0.28, 22 * k);
      st.values.forEach((v, j) => {
        const jit = (((j * 0.6180339887) % 1) * 2 - 1) * spread;
        s('circle', { cx: cx(i) + jit, cy: f.y(v), r: 3.5 * k, fill: hi ? 'var(--s1)' : 'var(--ctx)', 'fill-opacity': hi ? 0.8 : 1, stroke: 'var(--surface)', 'stroke-width': 1.5 }, P);
      });
      const half = Math.min(bandW * 0.36, 28 * k);
      s('line', { x1: cx(i) - half, x2: cx(i) + half, y1: f.y(st.mean), y2: f.y(st.mean), stroke: 'var(--text2)', 'stroke-width': 2 * k, 'stroke-linecap': 'round' }, P);
    });
    crosshair(f, units.map((u, i) => ({ x: cx(i) })), (i) => {
      const u = units[i], st = u.chars.get(c.position);
      return tipBox(`Auftrag ${u.id} · Charge ${u.batch.batchNo || '–'}`, [
        { key: 'gauss', value: `${fmt(st.mean, Math.min(d + 1, 4))} ${c.unit}`, label: `x̄ · s = ${fmt(st.sd, Math.min(d + 1, 4))}` },
        { value: `${fmt(st.min, d)}–${fmt(st.max, d)}`, label: `Min–Max · n = ${st.n}` },
      ], st.below + st.above ? `⚠ ${st.below + st.above} außerhalb (${st.below} unter UGW, ${st.above} über OGW)` : 'alle Werte in Toleranz');
    }, (i) => select(units[i].id));
  }

  // ------------------------------------------------------------ Kennwerte
  function renderStats() {
    const sec = $('statsSec'), ds = state.ds, u = selUnit();
    const gl = Object.fromEntries(C.GROUPS.map((g) => [g.id, g.label]));
    const body = h('tbody');
    let cur = null, shown = 0;
    const q = state.filter.trim().toLowerCase();
    for (const c of ds.charsGrouped) {
      const st = u.chars.get(c.position);
      if (q && ![c.position, c.cls.label, c.remark, c.charText, gl[c.cls.sub]].some((t) => (t || '').toLowerCase().includes(q))) continue;
      if (state.onlyOut && !(st && st.below + st.above)) continue;
      shown++;
      if (c.cls.sub !== cur) { body.append(h('tr', { class: 'grp' }, h('td', { colspan: 13, text: gl[c.cls.sub] }))); cur = c.cls.sub; }
      const d = dp(c);
      const two = c.lsl != null && c.usl != null && c.nominal != null;
      const dev = st && two ? (c.unit === 'mm' ? `${fmtS(um(st.mean - c.nominal), 1)} µm` : fmtS(st.mean - c.nominal, d + 1)) : '–';
      const out = st ? st.below + st.above : 0;
      body.append(h('tr', {
        class: 'click' + (c.position === state.cmp ? ' sel' : ''), tabindex: 0, title: 'Im Auftragsvergleich zeigen',
        onclick: () => pickChar(c.position), onkeydown: (e) => { if (e.key === 'Enter') pickChar(c.position); },
      },
        h('td', { text: c.position }), h('td', { class: 'lbl', text: c.cls.label }), h('td', { text: c.unit }),
        h('td', { class: 'num', text: fmt(c.nominal, d) }), h('td', { class: 'num', text: fmt(c.lsl, d) }), h('td', { class: 'num', text: fmt(c.usl, d) }),
        h('td', { class: 'num', text: st ? String(st.n) : '0' }),
        h('td', { class: 'num', text: st ? fmt(st.mean, Math.min(d + 1, 4)) : '–' }),
        h('td', { class: 'num', text: dev }),
        h('td', { class: 'num', text: st ? fmt(st.sd, Math.min(d + 1, 4)) : '–' }),
        h('td', { class: 'num', text: st ? fmt(st.min, d) : '–' }),
        h('td', { class: 'num', text: st ? fmt(st.max, d) : '–' }),
        h('td', { class: 'num' + (out ? ' oot' : ''), text: out ? `⚠ ${out} (↓${st.below} ↑${st.above})` : st ? '0' : '–' }),
      ));
    }
    if (!shown) body.append(h('tr', null, h('td', { colspan: 13, class: 'muted', text: 'Keine Merkmale passen zum Filter.' })));
    const exportBtn = h('button', { class: 'btn', type: 'button', onclick: doExport, text: 'Kennwerte exportieren (CSV)' });
    const search = h('input', { type: 'search', placeholder: 'Filter: Position, Merkmal, Text …', 'aria-label': 'Merkmale filtern', value: state.filter });
    search.addEventListener('input', () => { state.filter = search.value; const pos = search.selectionStart; renderStats(); const n = $('statsSec').querySelector('input[type=search]'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* egal */ } });
    const onlyOut = h('input', { type: 'checkbox', onchange: (e) => { state.onlyOut = e.target.checked; renderStats(); } });
    onlyOut.checked = state.onlyOut;
    const filters = h('div', { class: 'filters' }, search, h('label', null, onlyOut, 'nur Merkmale mit Werten außerhalb Toleranz'), h('span', { class: 'muted', text: `${shown} von ${ds.chars.length} Merkmalen` }));
    sec.replaceChildren(
      h('div', { class: 'sec-head' },
        h('div', null, h('h2', { text: 'Kennwerte' }), h('p', { class: 'sub', text: unitTitle(u) + ' · Zeile anklicken = Merkmal im Auftragsvergleich zeigen' })),
        h('div', { class: 'toolbar' }, exportBtn)),
      filters,
      h('div', { class: 'scroll tall' }, h('table', null,
        h('thead', null, h('tr', null, ['Pos.', 'Merkmal', 'Einheit', 'Nennmaß', 'UGW', 'OGW', 'n', 'x̄', 'x̄ − Nenn', 's', 'Min', 'Max', 'außerhalb'].map((t, i) => h('th', { class: i >= 3 ? 'num' : null, text: t })))),
        body)),
      h('p', { class: 'note', text: 'Export: alle Merkmale, gepoolt und je Auftrag, Semikolon-getrennt mit Dezimalkomma (öffnet direkt in Excel).' }));
  }
  function pickChar(pos) {
    state.cmp = pos;
    renderCompare(); renderStats();
    $('compareSec').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function doExport() {
    const csv = C.exportCSV(state.ds, state.res);
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `${PART[state.ds.partType].label}_Kennwerte_${state.ds.material || 'Material'}_${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }


  // ------------------------------------------------------------ Paarung
  const ST_ICON = { ok: '✓', warn: '!', out: '✕', na: '–' };
  const ST_LABEL = { ok: 'in Grenzen', warn: 'knapp', out: 'außerhalb', na: 'keine Daten' };
  const ST_LABEL_CAP = { ok: 'ok', warn: 'knapp', out: 'außerhalb', na: 'keine Daten' };
  const isCap = () => !!(pair.pm && pair.pm.opts.basis === 'cap');
  const stL = (st) => (isCap() ? ST_LABEL_CAP : ST_LABEL)[st];
  const stIcon = (st) => h('i', { class: 'ic ' + st, 'aria-hidden': 'true', text: ST_ICON[st] });
  const fmtN = (v) => fmt(v, Number.isInteger(v) ? 0 : 1);
  /*
   * Anzeige auf 0,1 µm, immer zur Grenze hin gerundet (Untergrenze abrunden, Obergrenze aufrunden, Reserve abrunden).
   * So widersprechen angezeigte Zahl und Status nie (z. B. Reserve 4,96 µm → „+4,9“, nicht „+5,0“ neben „knapp“).
   */
  const floor1 = (v) => Math.floor(v * 10 + 1e-9) / 10, ceil1 = (v) => Math.ceil(v * 10 - 1e-9) / 10;
  const fmtRes = (r) => (r == null || !isFinite(r) ? '–' : fmtS(floor1(r), 1));
  function rng(lo, hi, lim) {
    if (lo == null || !isFinite(lo)) return '–';
    if (Math.abs(hi - lo) < 1e-9) { // Einzelwert: zur näheren Grenze hin runden
      const [L, H] = lim || [-Infinity, Infinity];
      return fmtS(lo - L < H - lo ? floor1(lo) : ceil1(lo), 1);
    }
    return `${fmtS(floor1(lo), 1)} … ${fmtS(ceil1(hi), 1)}`;
  }
  const rngB = (a) => rng(a.lo, a.hi, pair.pm && pair.pm.opts.bcdLim);
  const rngL = (a) => rng(a.lo, a.hi, pair.pm && pair.pm.opts.leadLim);
  const winLabel = (c) => c.cls.label.replace('Steigung ', '');

  // ---- Fähigkeit (Cpk_Δ): Formatierung und Texte
  /** Cpk auf 2 Stellen, zur Grenze hin abgerundet (konsistent mit dem Status). */
  const fmtCpk = (v) => (v == null || !isFinite(v) ? '–' : fmt(C.floorTo(v, 2), 2));
  const NF_SIG2 = new Intl.NumberFormat('de-DE', { maximumSignificantDigits: 2 });
  /** Anteil außerhalb nur als Größenordnung: 2 signifikante Stellen, aufgerundet. */
  function fmtP(p) {
    if (p == null || !isFinite(p)) return '–';
    if (p < 1e-8) return '< 0,01 ppm';
    const v = C.ceilSig(p * 1e6, 2);
    return v < 1000 ? `${NF_SIG2.format(v)} ppm` : `${NF_SIG2.format(C.ceilSig(p * 100, 2))} %`;
  }
  const fmtNu = (v) => (v == null ? '–' : !isFinite(v) ? '∞' : fmt(v, 1));
  const fmtPv = (p) => (p == null ? '–' : p < 0.001 ? '< 0,001' : fmt(p, 3));
  const SRC_L = { own: 'eigene', borrowed: 'übernommen', none: 'nicht schätzbar' };
  const plTeil = (n) => `${n} ${n === 1 ? 'Teil' : 'Teile'}`;
  const capLim = (it) => (it.gang != null ? pair.pm.opts.bcdLim : pair.pm.opts.leadLim);
  const cpkPair = (c) => (c ? `${fmtCpk(c.cpk)} (${fmtCpk(c.cpkLo)})` : '–');
  /** Grund für den Status eines Orts. */
  function capReason(it) {
    const c = it.cap;
    if (!c) return 'keine Daten: Streuung nicht schätzbar (weniger als 3 einbezogene Aufträge mit mindestens 3 Teilen) – keine Bewertung';
    if (it.status === 'out') return `außerhalb: Cpk_Δ ${fmtCpk(c.cpk)} < 1,00`;
    if (it.status === 'warn') return `knapp: Fähigkeit nicht nachgewiesen – untere 95-%-Grenze ${fmtCpk(c.cpkLo)} < 1,00`;
    return `ok: Cpk_Δ ≥ 1,00 mit 95 % nachgewiesen (untere Grenze ${fmtCpk(c.cpkLo)})`;
  }
  /** Hinweise zur Streuung eines Orts (σ*, σ!, E/L, nicht schätzbar). */
  function flagLines(it) {
    const r = [];
    for (const [who, e] of [['Mutter', it.nutSpread], ['Spindel', it.spSpread]]) {
      if (!e) continue;
      if (e.src === 'borrowed') r.push(`σ* ${who}: ${plTeil(e.n)} – Streuung übernommen, gepoolt aus ${e.pool.k} Aufträgen (${fmt(um(e.sUsed), 2)} µm), ν = min(d̂₀ ${fmtNu(e.d0)}; Σν ${e.pool.df}) = ${fmtNu(e.df)}`);
      if (e.src === 'none') r.push(`${who}: ${plTeil(e.n)}, Streuung nicht schätzbar`);
      if (e.flagged) r.push(`σ! ${who}: Streuung auffällig, s ${fmt(um(e.sUsed), 2)} µm gegenüber ${fmt(um(e.sOthers), 2)} µm der übrigen Aufträge (F-Test p ${fmtPv(e.fP)})`);
      if (e.el && e.el.flagged) r.push(`E/L ${who}: Letzt- − Erststücke ${fmtS(um(e.el.d), 1)} µm (Welch-Test p ${fmtPv(e.el.p)}), Streuung innerhalb der Gruppen ${fmt(um(e.el.sW), 2)} µm`);
    }
    return r;
  }
  /** Langtext eines Orts für Tooltip und Screenreader. */
  function capItemText(it) {
    const c = it.cap, lim = capLim(it);
    const parts = [C.pairLoc(it)];
    if (c) {
      parts.push(`μΔ ${fmt(c.mu, 1)} µm`, `σΔ ${fmt(c.sd, 2)} µm (Mutter ${SRC_L[c.srcM]} ${fmt(c.sM, 2)}, Spindel ${SRC_L[c.srcS]} ${fmt(c.sS, 2)})`, `ν ${fmtNu(c.nu)}`,
        `μΔ ± 3σΔ ${rng(c.lo, c.hi, lim)} µm`, `Cpk_Δ ${fmtCpk(c.cpk)}, untere 95-%-Grenze ${fmtCpk(c.cpkLo)}`, `außerhalb erwartet ≈ ${fmtP(c.pPred)}`,
        `${c.kOut} von ${c.N} Teilekombinationen außerhalb`);
    }
    parts.push(`Min/Max ${rng(it.mm.lo, it.mm.hi, lim)} µm`);
    return [parts.join(' · '), capReason(it), ...flagLines(it)].join('\n');
  }
  /** Marken am maßgeblichen Ort. */
  function capMarks(it) {
    if (!it || !it.flags) return null;
    const m = [];
    if (it.flags.borrowed.length) m.push(['σ*', `Streuung übernommen (${it.flags.borrowed.join(', ')})`]);
    if (it.flags.sigma.length) m.push(['σ!', `Streuung auffällig (${it.flags.sigma.join(', ')})`]);
    if (it.flags.el.length) m.push(['E/L', `Versatz Erst-/Letztstücke (${it.flags.el.join(', ')})`]);
    return m.length ? h('span', { class: 'mks' }, m.map(([t, ti]) => h('span', { class: 'mk', title: ti, text: t }))) : null;
  }
  /** Zusammenfassung eines Kriteriums über alle Orte (Fähigkeit). */
  function capAggText(a) {
    if (!a.items.length) return 'keine vergleichbaren Werte';
    const r = [`${a.items.length} ${a.items.length === 1 ? 'Ort' : 'Orte'}: ${a.nOut} außerhalb, ${a.nWarn} knapp${a.nNa ? `, ${a.nNa} ohne Daten` : ''}`];
    if (a.pMax != null) r.push(`mind. ein Ort außerhalb ≈ ${fmtP(a.pMax)} … ${fmtP(a.pSum)}`);

  /** Zahlenfeld als Text: Komma oder Punkt; ungültige Eingaben werden sichtbar abgelehnt und der wirksame Wert bleibt stehen. */
  function numInput(label, value, onSet, step, check) {
    const shown = fmt(value, Number.isInteger(value) ? 0 : (Math.round(value * 100) % 10 ? 2 : 1)).replace('−', '-');
    const inp = h('input', { type: 'text', inputmode: 'decimal', class: 'numin', 'aria-label': label, autocomplete: 'off', spellcheck: 'false' });
    inp.value = shown;
    const reject = (msg) => {
      inp.setAttribute('aria-invalid', 'true'); inp.title = msg; showPairMsg(msg);
      setTimeout(() => { inp.value = shown; inp.removeAttribute('aria-invalid'); inp.title = ''; }, 1600);
    };
    inp.addEventListener('change', () => {
      const raw = String(inp.value).trim().replace(/\s/g, '').replace('−', '-');
      if (!/^[+-]?(\d+([.,]\d*)?|[.,]\d+)$/.test(raw)) { reject(`„${inp.value}“ ist keine Zahl – ${label} bleibt ${shown}.`); return; }
      const v = Number(raw.replace(',', '.'));
      const err = check ? check(v) : null;
      if (err) { reject(err); return; }
      onSet(v); savePairOpts(); renderPairing();
    });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); });
    return inp;
  }
  function showPairMsg(msg) {
    const el = document.getElementById('pairMsg');

  function segGroup(label, key, options) {
    const o = pair.opts;

  }

  /** Name eines Merkmals in der Paarung: Spindel „Gang n“, Mutter „KRk“, Steigung das Fenster. */
  function posName(part, pos) {
    const c = states[part].ds && states[part].ds.charMap.get(pos);
    if (!c) return pos;
    if (c.cls.group === 'lead') return winLabel(c);
    if (c.cls.kr != null) return `KR${c.cls.kr}`;
    if (c.cls.gang != null) return `Gang ${c.cls.gang}`;
    return pos;
  }
  const nameList = (part, poss) => {
    const names = poss.map((p) => posName(part, p));
    const gangs = names.filter((n) => /^Gang \d+$/.test(n)).map((n) => n.slice(5)), rest = names.filter((n) => !/^Gang \d+$/.test(n));
    return [...(gangs.length ? [`Gang ${gangs.join(', ')}`] : []), ...rest].join(', ');
  };
  const spanOf = (vals, f) => { const lo = Math.min(...vals), hi = Math.max(...vals); return f(lo) === f(hi) ? f(lo) : `${f(lo)} … ${f(hi)}`; };
  /** Hinweise zur Streuung je Auftrag an den verglichenen Merkmalen (σ*, σ!, E/L, nicht schätzbar). */
  function spreadHints(pm) {
    const out = [];
    for (const [part, key, units] of [['mutter', 'nu', pm.nuU], ['spindel', 'sp', pm.spU]]) {
      const ds = states[part].ds;
      const poss = ds.charsGrouped.map((c) => c.position).filter((p) => pm.used[key].has(p));
      for (const u of units) {
        const ents = poss.map((p) => [p, pm.spread[key].get(p) && pm.spread[key].get(p).byOrder.get(u.id)]).filter(([, e]) => e);
        const bits = [];
        const pick = (f) => ents.filter(([, e]) => f(e));
        const where = (l) => (l.length === ents.length ? 'an allen Orten' : `an ${nameList(part, l.map(([p]) => p))}`);
        const bor = pick((e) => e.src === 'borrowed'), none = pick((e) => e.src === 'none');
        if (bor.length) bits.push(`σ* ${plTeil(bor[0][1].n)} – Streuung übernommen ${where(bor)}`);
        if (none.length) bits.push(`Streuung nicht schätzbar ${where(none)}`);
        const sig = pick((e) => e.flagged);
        if (sig.length) bits.push(`σ! Streuung auffällig an ${nameList(part, sig.map(([p]) => p))}: s ${spanOf(sig.map(([, e]) => um(e.sUsed)), (v) => fmt(v, 1))} µm, übrige ≈ ${spanOf(sig.map(([, e]) => um(e.sOthers)), (v) => fmt(v, 1))} µm`);
        const el = pick((e) => e.el && e.el.flagged);
        if (el.length) bits.push(`E/L Letzt- − Erststücke ${spanOf(el.map(([, e]) => um(e.el.d)), (v) => fmtS(v, 1))} µm an ${nameList(part, el.map(([p]) => p))}`);
        if (bits.length) out.push(h('li', null, h('strong', { text: `${PART[part].label} ${u.id}: ` }), bits.join(' · ')));
      }
    }
    return out;
  }

      else d.push('Streuung nicht schätzbar');
      if (a.items.length > 1 && a.pMax != null) d.push(`mind. ein Ort außerhalb ≈ ${fmtP(a.pMax)} … ${fmtP(a.pSum)}`);
      return tile(lab, c ? `Cpk_Δ ${cpkPair(c)}` : '–', d.join(' · '), a.status === 'out');
    };
    const tiles = cap
      ? h('div', { class: 'tiles' },
        capTile('ΔBCD', cell.bcd, 'keine vergleichbaren BCD-Werte'),
        capTile('ΔSteigung', cell.lead, 'keine vergleichbaren Steigungsfenster'),
        tile('Grenzen', `BCD ${fmtN(o.bcdLim[0])}…${fmtN(o.bcdLim[1])} · Stg. ±${fmtN(o.leadLim[1])}`, 'µm · außerhalb bei Cpk_Δ < 1,00 · knapp bei unterer 95-%-Grenze < 1,00 · Zahl in Klammern = untere Grenze'))
      : h('div', { class: 'tiles' },
        tile('ΔBCD', cell.bcd.lo != null ? `${rngB(cell.bcd)} µm` : '–', wB ? `${ST_LABEL[cell.bcd.status]} · Reserve ${fmtRes(cell.bcd.reserve)} µm · knappste Stelle Gang ${wB.gang} / KR${wB.kr}` : 'keine vergleichbaren BCD-Werte', cell.bcd.status === 'out'),
        tile('ΔSteigung', cell.lead.lo != null ? `${rngL(cell.lead)} µm` : '–', wL ? `${ST_LABEL[cell.lead.status]} · Reserve ${fmtRes(cell.lead.reserve)} µm · ${winLabel(wL.nutChar)} / ${winLabel(wL.spChar)}` : 'keine vergleichbaren Steigungsfenster', cell.lead.status === 'out'),
        tile('Grenzen', `BCD ${fmtN(o.bcdLim[0])}…${fmtN(o.bcdLim[1])} · Stg. ±${fmtN(o.leadLim[1])}`, `µm · knapp unter ${fmtN(o.warnReserve)} µm Reserve`));
    const flagNotes = cap ? [...new Set([wB, wL].filter(Boolean).flatMap(flagLines))] : [];
    const box = h('div', { class: 'chartbox' });
    const shapes = ['circle', 'up', 'square', 'diamond'];
    const legend = h('div', { class: 'legend' },
      g.krs.map((k, i) => h('span', { class: 'lg static' }, shapeGlyph(shapes[i % shapes.length]), h('span', { class: 't', text: `KR${k}` }))),
      cap ? h('span', { class: 'lg static' }, capGlyph(), h('span', { class: 't', text: 'Punkt = μΔ, Balken = μΔ ± 3σΔ, dünner Strich = Min…Max' }))
        : h('span', { class: 'lg static' }, h('span', { class: 't', text: 'Strich = Δ Min…Max, Punkt = Δ der Mittel' })),
      h('span', { class: 'lg static' }, glyph('band'), h('span', { class: 't', text: `Grenzen ${fmtN(o.bcdLim[0])}…${fmtN(o.bcdLim[1])} µm` })));
    const spProf = new Map(cell.s.summary.bcd.profile.map((p) => [p.gang, p]));
    const nuProf = new Map(cell.n.summary.bcd.profile.filter((p) => p.kr != null).map((p) => [p.kr, p]));
    const itemAt = new Map(cell.bcd.items.map((it) => [it.gang + '|' + it.kr, it]));
    const d4 = (st) => (st ? fmt(st.mean, 4) : '–');
    const bcdTable = h('div', { class: 'scroll' }, h('table', null,
      h('thead', null, h('tr', null, h('th', { text: 'Spindelgang' }), h('th', { class: 'num', text: `Spindel ${fitL} x̄` }), g.krs.map((k) => h('th', { class: 'num', text: `KR${k}` })))),
      h('tbody', null, g.visibility.map((v) => h('tr', null,
        h('td', { text: `Gang ${v.gang}` }),
        h('td', { class: 'num', text: d4(spProf.get(v.gang)?.[o.fit]?.stats) }),
        g.krs.map((k) => {
          const it = itemAt.get(v.gang + '|' + k);
          if (!v.krs.includes(k)) return h('td', { class: 'num muted', title: 'KR läuft nicht über diesen Gang', text: '·' });
          if (!it) return h('td', { class: 'num muted', text: '–' });
          if (cap) return h('td', { class: 'num', title: capItemText(it) }, h('span', { class: 'cl', style: 'justify-content:flex-end' }, stIcon(it.status), cpkPair(it.cap), capMarks(it)));
          return h('td', { class: 'num', title: ST_LABEL[it.status] }, h('span', { class: 'cl', style: 'justify-content:flex-end' }, stIcon(it.status), rngB(it)));
        })))),
      h('tfoot', null, h('tr', null, h('td', { text: `Mutter ${fitL} x̄` }), h('td'), g.krs.map((k) => h('td', { class: 'num', text: d4(nuProf.get(k)?.[o.fit]?.stats) }))))));
    const leadTable = cap ? capLeadTable(cell) : h('div', { class: 'scroll' }, h('table', null,
      h('thead', null, h('tr', null, ['Mutter', 'Spindel', 'Mutter L min…max', 'Spindel L min…max', 'Δ [µm]', 'Reserve', 'Status'].map((t, i) => h('th', { class: i >= 2 ? 'num' : null, text: t })))),
      h('tbody', null, cell.lead.items.length ? cell.lead.items.map((it) => h('tr', null,
        h('td', { text: `${winLabel(it.nutChar)} (${fmt(it.nutChar.nominal, 1)} mm)` }),
        h('td', { text: winLabel(it.spChar) }),
        h('td', { class: 'num', text: `${fmt(it.nutStats.min, 4)} … ${fmt(it.nutStats.max, 4)}` }),
        h('td', { class: 'num', text: `${fmt(it.spStats.min, 4)} … ${fmt(it.spStats.max, 4)}` }),
        h('td', { class: 'num', text: rngL(it) }),
        h('td', { class: 'num', text: fmtRes(it.reserve) }),
        h('td', null, h('span', { class: 'cl' }, stIcon(it.status), ST_LABEL[it.status])))) : h('tr', null, h('td', { colspan: 7, class: 'muted', text: 'Keine vergleichbaren Steigungsfenster.' })))));
    det.replaceChildren(...[head, tiles,
      flagNotes.length ? h('ul', { class: 'hintlist' }, flagNotes.map((t) => h('li', { text: t }))) : null,
      h('div', null, h('div', { class: 'chart-title' }, h('h3', { text: `ΔBCD je Spindelgang (${fitL})` }), h('span', { class: 'muted', text: 'je sichtbarer Kugelrille, Mutter − Spindel in µm' })), legend, box),
      h('div', { class: cap ? null : 'duo-eq', style: 'margin-top:1rem' },
        h('div', null, h('div', { class: 'h3row' }, h('h3', { text: 'BCD: Spindelgang × Kugelrille' }), cap ? h('span', { class: 'muted', text: 'Cpk_Δ (untere 95-%-Grenze) je Ort · Tooltip = Rechenweg' }) : null), bcdTable,
          h('p', { class: 'note', text: '· = KR läuft nicht über diesen Gang (siehe Sichtbarkeit).' })),
        h('div', null, h('div', { class: 'h3row' }, h('h3', { text: 'Steigung: Fenster gleicher Nennlänge' })), leadTable)),
      cap ? capCalc(cell) : null].filter(Boolean));
    drawPairBcd(box, cell);
  }

  /** Steigungstabelle bei „Fähigkeit“. */
  function capLeadTable(cell) {
    const cols = ['Fenster Mutter / Spindel', 'n_M × n_S', 'Min … Max [µm]', 'μΔ [µm]', 'σΔ [µm] (Mutter / Spindel)', 'ν_Δ', 'Cpk_Δ', 'untere Grenze', 'außerhalb erwartet', 'k / N', 'Status'];
    return h('div', { class: 'scroll' }, h('table', null,
      h('thead', null, h('tr', null, cols.map((t, i) => h('th', { class: i >= 1 && i <= 9 ? 'num' : null, text: t })))),
      h('tbody', null, cell.lead.items.length ? cell.lead.items.map((it) => {
        const c = it.cap;
        return h('tr', { title: capItemText(it) },
          h('td', { text: `${winLabel(it.nutChar)} (${fmt(it.nutChar.nominal, 1)} mm) / ${winLabel(it.spChar)}` }),
          h('td', { class: 'num', text: `${it.nutStats.n} × ${it.spStats.n}` }),
          h('td', { class: 'num', text: rng(it.mm.lo, it.mm.hi, pair.pm.opts.leadLim) }),
          h('td', { class: 'num', text: c ? fmtS(c.mu, 1) : '–' }),
          h('td', { class: 'num', text: c ? `${fmt(c.sd, 2)} (${fmt(c.sM, 2)} ${SRC_L[c.srcM]} / ${fmt(c.sS, 2)} ${SRC_L[c.srcS]})` : '–' }),
          h('td', { class: 'num', text: c ? fmtNu(c.nu) : '–' }),
          h('td', { class: 'num', text: c ? fmtCpk(c.cpk) : '–' }),
          h('td', { class: 'num', text: c ? fmtCpk(c.cpkLo) : '–' }),
          h('td', { class: 'num', text: c ? fmtP(c.pPred) : '–' }),
          h('td', { class: 'num', text: c ? `${c.kOut} / ${c.N}` : '–' }),
          h('td', null, h('span', { class: 'cl' }, stIcon(it.status), ST_LABEL_CAP[it.status], capMarks(it))));
      }) : h('tr', null, h('td', { colspan: cols.length, class: 'muted', text: 'Keine vergleichbaren Steigungsfenster.' })))));
  }

  /** Aufklappbarer Rechenweg: die 5 maßgeblichsten BCD-Orte und alle Steigungsfenster. */
  function capCalc(cell) {
    const worse = (a, b) => (C.SEVERITY[b.status] - C.SEVERITY[a.status]) || ((a.cap ? a.cap.cpk : -Infinity) - (b.cap ? b.cap.cpk : -Infinity));
    const rows = [...cell.bcd.items].sort(worse).slice(0, 5).concat(cell.lead.items);
    const sTxt = (c, side) => `${fmt(side === 'M' ? c.sM : c.sS, 2)} ${SRC_L[side === 'M' ? c.srcM : c.srcS]}${(side === 'M' ? c.srcM : c.srcS) === 'own' ? '' : `, ν ${fmtNu(side === 'M' ? c.dfM : c.dfS)}`}`;
    const cols = ['Ort', 'n_M', 'n_S', 'x̄_M [mm]', 'x̄_S [mm]', 's_M [µm]', 's_S [µm]', 'μ̂ [µm]', 'σ̂_Δ [µm]', 'ν_Δ', 'ñ', 'Ĉ_L', 'Ĉ_U', 'SE_L / SE_U', 'Cpk_Δ', 'Cpk_unten', 'p prädiktiv', 'p⁰ (Punktschätzung)', 'Status'];
    const tbl = h('div', { class: 'scroll' }, h('table', null,
      h('thead', null, h('tr', null, cols.map((t, i) => h('th', { class: i ? 'num' : null, text: t })))),
      h('tbody', null, rows.map((it) => {
        const c = it.cap, mS = it.nutSpread, sS = it.spSpread;
        if (!c) return h('tr', null, h('td', { text: C.pairLoc(it) }), h('td', { class: 'num', text: mS ? String(mS.n) : '–' }), h('td', { class: 'num', text: sS ? String(sS.n) : '–' }), h('td', { colspan: cols.length - 4, class: 'muted', text: capReason(it) }), h('td', null, h('span', { class: 'cl' }, stIcon(it.status), ST_LABEL_CAP[it.status])));
        return h('tr', null,
          h('td', { text: C.pairLoc(it) }), h('td', { class: 'num', text: String(c.nM) }), h('td', { class: 'num', text: String(c.nS) }),
          h('td', { class: 'num', text: fmt(mS.mean, 5) }), h('td', { class: 'num', text: fmt(sS.mean, 5) }),
          h('td', { class: 'num', text: sTxt(c, 'M') }), h('td', { class: 'num', text: sTxt(c, 'S') }),
          h('td', { class: 'num', text: fmt(c.mu, 2) }), h('td', { class: 'num', text: fmt(c.sd, 3) }), h('td', { class: 'num', text: fmtNu(c.nu) }), h('td', { class: 'num', text: fmt(c.nEff, 2) }),
          h('td', { class: 'num', text: fmt(c.cpkL, 3) }), h('td', { class: 'num', text: fmt(c.cpkU, 3) }), h('td', { class: 'num', text: `${fmt(c.seL, 3)} / ${fmt(c.seU, 3)}` }),
          h('td', { class: 'num', text: fmtCpk(c.cpk) }), h('td', { class: 'num', text: fmtCpk(c.cpkLo) }), h('td', { class: 'num', text: fmtP(c.pPred) }), h('td', { class: 'num', text: fmtP(c.pPlug) }),
          h('td', null, h('span', { class: 'cl' }, stIcon(it.status), ST_LABEL_CAP[it.status])));
      }))));
    const z = fmt(C.normInv(C.CAP.conf), 3);
    const f = [
      'μ̂ = x̄_M − x̄_S · σ̂_Δ = √(s_M² + s_S²) · ν_Δ = σ̂_Δ⁴ / (s_M⁴/ν_M + s_S⁴/ν_S) (Welch-Satterthwaite) · ñ = σ̂_Δ² / (s_M²/n_M + s_S²/n_S)',
      `Ĉ_L = (μ̂ − L) / (3σ̂_Δ), Ĉ_U = (U − μ̂) / (3σ̂_Δ), Cpk_Δ = min(Ĉ_L, Ĉ_U) · SE = √(1/(9ñ) + Ĉ²/(2ν_Δ)) · Cpk_unten = min(Ĉ − ${z}·SE) (Delta-Methode, Näherung; simuliert Überdeckung 0,93–0,95)`,
      'p prädiktiv = T_ν((L − μ̂)/σ_p) + T_ν((μ̂ − U)/σ_p) mit σ_p = σ̂_Δ·√(1 + 1/ñ), t-Verteilung mit ν = ν_Δ – enthält die Schätzunsicherheit, nur Größenordnung · p⁰ = Φ(−3Ĉ_L) + Φ(−3Ĉ_U)',
      'Streuung je Auftrag (ν = n − 1), mindestens Auflösung/√12 · Aufträge mit weniger als 3 Teilen übernehmen die gepoolte Streuung der übrigen einbezogenen Aufträge, ν = min(d̂₀ nach Smyth, Σν) · unter 3 Aufträgen mit eigener Streuung: keine Daten',
      'Status: außerhalb bei Cpk_Δ < 1,00 · knapp bei Cpk_Δ ≥ 1,00 und Cpk_unten < 1,00 · sonst ok · Zelle = schlechtester Ort · Annahmen: zufällige Kombination in der Montage, Stichprobe vertritt den Auftrag, Normalverteilung im Auftrag',
    ];
    const d = h('details', { style: 'margin-top:1rem', ontoggle: (e) => { pair.calcOpen = e.target.open; } },
      h('summary', null, 'Rechenweg ', h('span', { text: '· die 5 maßgeblichsten BCD-Orte und alle Steigungsfenster' })), tbl,
      f.map((t) => h('p', { class: 'note', text: t })));
    d.open = !!pair.calcOpen;
    return d;
  }

  function shapePath(kind, cx, cy, r) {
    if (kind === 'up') return triPath(cx, cy, r * 1.15, true);
    if (kind === 'square') return `M${cx - r * 0.85},${cy - r * 0.85}h${r * 1.7}v${r * 1.7}h${-r * 1.7}Z`;
    if (kind === 'diamond') return `M${cx},${cy - r * 1.2}L${cx + r * 1.2},${cy}L${cx},${cy + r * 1.2}L${cx - r * 1.2},${cy}Z`;
    return `M${cx - r},${cy}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0`;
  }
  function shapeGlyph(kind) {
    const g = s('svg', { width: 18, height: 12, viewBox: '0 0 18 12', 'aria-hidden': 'true', class: 'glyph' });
    s('line', { x1: 9, x2: 9, y1: 1, y2: 11, stroke: 'var(--s1)', 'stroke-width': 1.5 }, g);
    s('path', { d: shapePath(kind, 9, 6, 3.6), fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 1.5 }, g);
    return g;
  }
  function capGlyph() {
    const g = s('svg', { width: 18, height: 12, viewBox: '0 0 18 12', 'aria-hidden': 'true', class: 'glyph' });
    s('line', { x1: 9, x2: 9, y1: 0, y2: 12, stroke: 'var(--muted)', 'stroke-width': 1 }, g);
    s('line', { x1: 9, x2: 9, y1: 2.5, y2: 9.5, stroke: 'var(--s1)', 'stroke-width': 4, 'stroke-opacity': 0.45 }, g);
    s('circle', { cx: 9, cy: 6, r: 2.6, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 1.2 }, g);
    return g;
  }

  function drawPairBcd(host, cell) {
    const pm = pair.pm, o = pm.opts, g = pm.geo, cap = o.basis === 'cap';
    const items = cell.bcd.items;
    if (!items.length) { host.replaceChildren(h('p', { class: 'empty', text: 'Keine BCD-Werte für dieses Paar.' })); return; }
    const gangs = g.visibility.map((v) => v.gang);
    const ys = [o.bcdLim[0], o.bcdLim[1]];
    for (const it of items) { ys.push(it.mm.lo, it.mm.hi); if (cap && it.cap) ys.push(it.cap.lo, it.cap.hi); }
    const yd = niceDomain(ys, 7), dd = decimalsForStep(yd.step);
    const f = frame(host, {
      height: chartHeight(300), x: [Math.min(...gangs) - 0.7, Math.max(...gangs) + 0.7], y: yd.domain, yTicks: yd.ticks, yFmt: (v) => fmt(v, dd),
      xTicks: gangs.map((x) => ({ v: x, label: String(x) })), xTitle: 'Gang', aria: `ΔBCD je Spindelgang, Spindel ${cell.s.id} mit Mutter ${cell.n.id}`,
    });
    const P = f.plot, k = f.k;
    const yL = f.y(o.bcdLim[0]), yH = f.y(o.bcdLim[1]);
    s('rect', { x: f.m.l, width: f.W - f.m.l - f.m.r, y: yH, height: yL - yH, class: 'tolband' }, P);
    for (const [yy, lab] of [[yH, `max ${fmtN(o.bcdLim[1])}`], [yL, `min ${fmtN(o.bcdLim[0])}`]]) {
      s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: yy, y2: yy, class: 'tolline' }, P);
      s('text', { class: 'ann', x: f.W - f.m.r - 2 * k, y: yy - 4 * k, 'text-anchor': 'end' }, P).textContent = lab;
    }
    const shapes = ['circle', 'up', 'square', 'diamond'];
    const nK = g.krs.length, step = Math.min(0.17, 0.7 / Math.max(1, nK));
    const colOf = (st) => (st === 'out' ? 'var(--crit)' : 'var(--s1)');
    for (const it of items) {
      const i = g.krs.indexOf(it.kr);
      const X = f.x(it.gang + (i - (nK - 1) / 2) * step);
      const col = colOf(it.status);
      if (cap) {
        s('line', { x1: X, x2: X, y1: f.y(it.mm.lo), y2: f.y(it.mm.hi), stroke: 'var(--muted)', 'stroke-width': 1 * k }, P);
        if (it.cap) s('line', { x1: X, x2: X, y1: f.y(it.cap.lo), y2: f.y(it.cap.hi), stroke: col, 'stroke-width': 5 * k, 'stroke-opacity': 0.4 }, P);
        s('path', { d: shapePath(shapes[i % shapes.length], X, f.y(it.cap ? it.cap.mu : it.mid), 4 * k), fill: it.cap ? col : 'var(--muted)', stroke: 'var(--surface)', 'stroke-width': 1.5 }, P);
        continue;
      }
      if (Math.abs(it.hi - it.lo) > 1e-9) {
        s('line', { x1: X, x2: X, y1: f.y(it.lo), y2: f.y(it.hi), stroke: col, 'stroke-width': 1.5 * k }, P);
        for (const v of [it.lo, it.hi]) s('line', { x1: X - 3 * k, x2: X + 3 * k, y1: f.y(v), y2: f.y(v), stroke: col, 'stroke-width': 1.5 * k }, P);
      }
      s('path', { d: shapePath(shapes[i % shapes.length], X, f.y(it.mid), 4 * k), fill: col, stroke: 'var(--surface)', 'stroke-width': 1.5 }, P);
    }
    const byGang = new Map(gangs.map((x) => [x, items.filter((it) => it.gang === x)]));
    const pts = gangs.filter((x) => byGang.get(x).length);
    crosshair(f, pts.map((x) => ({ x: f.x(x) })), (idx) => {
      const x = pts[idx];
      const rows = byGang.get(x).map((it) => (cap
        ? { key: 'gauss', value: cpkPair(it.cap), label: `KR${it.kr} · ${ST_LABEL_CAP[it.status]}${it.cap ? ` · μΔ ${fmt(it.cap.mu, 1)}, ± 3σΔ ${rng(it.cap.lo, it.cap.hi, o.bcdLim)} · Min/Max ${rng(it.mm.lo, it.mm.hi, o.bcdLim)}` : ' · Streuung nicht schätzbar'}` }
        : { key: 'gauss', value: `${rngB(it)} µm`, label: `KR${it.kr} · ${ST_LABEL[it.status]} · Reserve ${fmtRes(it.reserve)}` }));
      return tipBox(`Spindelgang ${x}${cap ? ' · Cpk_Δ (untere Grenze)' : ''}`, rows,
        `Spindel ${fitLabel(o)} x̄ ${fmt(byGang.get(x)[0].sp.stats.mean, 4)} mm · Grenzen ${fmtN(o.bcdLim[0])}…${fmtN(o.bcdLim[1])} µm`);
    });
  }
  const fitLabel = (o) => C.FIT_LABEL[o.fit];

  function doExportPairing(pm) {
    const csv = C.exportPairingCSV(pm, states.spindel.ds, states.mutter.ds);
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `Paarung_${states.spindel.ds.material || 'Spindel'}_${states.mutter.ds.material || 'Mutter'}_${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ------------------------------------------------------------ Größe
  // Diagramme bei Breiten-/Höhenänderung (Fenster, Zoom, Wechsel des Monitors) neu zeichnen
  let lastKey = '', rt = 0;
  const redraw = () => {
    const key = `${document.querySelector('main').clientWidth}x${window.innerHeight}@${rootScale()}`;
    if (key === lastKey) return;
    lastKey = key;
    clearTimeout(rt);
    rt = setTimeout(() => { if (view === 'paarung') renderPairDetail(); else if (state.res) { renderProfile(); renderCompare(); } }, 120);
  };
  new ResizeObserver(redraw).observe(document.querySelector('main'));
  window.addEventListener('resize', redraw);

  // Für Tests/Automatisierung: Text direkt laden
  globalThis.SubApp = { loadText: (text, name) => { const p = C.parseCAQ(text, name || 'eingefuegt.csv'); p.encoding = 'Text'; addParsed([p]); }, states, switchPart, get state() { return state; } };
  renderSteps();
})();
</script>
