    while (x < 10) { r -= 1 / x; x += 1; }
    const f = 1 / (x * x);
    return r + Math.log(x) - 0.5 / x - f * (1 / 12 - f * (1 / 120 - f * (1 / 252 - f * (1 / 240 - f * (1 / 132 - f * 691 / 32760)))));
  }
  /** Trigamma ψ′(x) für x > 0: Rekursion bis x ≥ 10, dann asymptotische Reihe. */
  function trigamma(x) {
    let r = 0;
    while (x < 10) { r += 1 / (x * x); x += 1; }
    const f = 1 / (x * x);
    return r + 1 / x + f / 2 + f / x * (1 / 6 - f * (1 / 30 - f * (1 / 42 - f * (1 / 30 - f * (5 / 66 - f * 691 / 2730)))));
  }
  /** Umkehrfunktion von ψ′ (monoton fallend): Bisektion in ln x. */
  function trigammaInv(y) {
    if (!(y > 0)) return NaN;
    let lo = -40, hi = 40;
    for (let i = 0; i < 200 && hi - lo > 1e-15; i++) {
      const mid = (lo + hi) / 2;
      if (trigamma(Math.exp(mid)) > y) lo = mid; else hi = mid;
    }
    return Math.exp((lo + hi) / 2);
  }
  /**
   * Freiheitsgrade d̂₀ der Streuung zwischen Aufträgen (Smyth 2004, Momentenschätzer wie limma::fitFDist):
   * e_j = ln s_j² − ψ(ν_j/2) + ln(ν_j/2); V = Σ(e_j − ē)²/(G−1) − (1/G)·Σ ψ′(ν_j/2); V ≤ 0 ⇒ d̂₀ = ∞, sonst 2·ψ′⁻¹(V).
   * Gibt an, wie gut eine übernommene (gepoolte) Streuung die Streuung eines einzelnen Auftrags trifft.
   */
  function smythD0(s2, df) {
    const G = s2.length;
    if (G < 2) return { d0: Infinity, s02: G ? s2[0] : null, V: null };
    const e = s2.map((v, j) => Math.log(v) - digamma(df[j] / 2) + Math.log(df[j] / 2));
    const eb = e.reduce((a, v) => a + v, 0) / G;
    const V = e.reduce((a, v) => a + (v - eb) * (v - eb), 0) / (G - 1) - df.reduce((a, d) => a + trigamma(d / 2), 0) / G;
    if (!(V > 0)) return { d0: Infinity, s02: Math.exp(eb), V };
    const d0 = 2 * trigammaInv(V);
    return { d0, s02: Math.exp(eb + digamma(d0 / 2) - Math.log(d0 / 2)), V };
  }

  /** Kennwerte (Spindel oder Mutter) aus den Merkmalsstatistiken einer Einheit (Auftrag oder gepoolt). */
  function summarize(ds, chars) {
    const gangs = new Map();
    const overall = {};
    const gaussVals = [];
    let nominal = null;
    for (const c of ds.chars) {
      if (c.cls.group !== 'bcd') continue;
      const st = chars.get(c.position);
      if (c.cls.overall) { if (st) overall[c.cls.fit] = { char: c, stats: st }; continue; }
      if (!st || c.cls.gang == null) continue;
      let g = gangs.get(c.cls.gang);
      if (!g) gangs.set(c.cls.gang, (g = { gang: c.cls.gang, kr: c.cls.kr ?? null }));
      g[c.cls.fit] = { char: c, stats: st };
      if (c.cls.fit === 'gauss') { for (const v of st.values) gaussVals.push(v); if (nominal == null) nominal = c.nominal; }
    }
    // Zylinder (gesamt) nur verwenden, wenn er in allen Aufträgen gemessen ist – sonst einheitlich das KR-Mittel
    const useOverall = !!(overall.gauss && overall.gauss.char.orders.size === ds.batches.length);
    if (useOverall) nominal = overall.gauss.char.nominal;
    const profile = [...gangs.values()].sort((a, b) => a.gang - b.gang);
    const gMeans = profile.filter((g) => g.gauss).map((g) => g.gauss.stats.mean);
    const form = profile.filter((g) => g.huell && g.pferch).map((g) => g.huell.stats.mean - g.pferch.stats.mean);
    const windows = ds.chars
      .filter((c) => c.cls.group === 'lead' && chars.get(c.position) && c.cls.from != null && c.nominal > 0)
      .map((c) => {
        const st = chars.get(c.position), t = c.cls.turns || null;
        return { char: c, stats: st, from: c.cls.from, to: c.cls.to, turns: t, length: c.nominal, pitch: t ? st.mean / t : null, nominalPitch: t ? c.nominal / t : null };
      })
      .sort((a, b) => a.from - b.from || b.length - a.length);
    // Hauptfenster = größte Nennlänge (Spindel: 3 × 17,4 mm über je 6 Gänge; Mutter: KR1–KR4)
    const maxLen = windows.length ? Math.max(...windows.map((w) => w.length)) : 0;
    const main = windows.filter((w) => Math.abs(w.length - maxLen) < 1e-9);
    const mainMeans = main.map((w) => w.stats.mean);
    const maxTurns = main.length && main.every((w) => w.turns) ? main[0].turns : null;
    let oot = 0, ootThread = 0, nPerChar = 0;
    const ootChars = [], ootThreadChars = [];
    for (const c of ds.chars) {
      const st = chars.get(c.position);
      if (!st) continue;
      const o = st.below + st.above;
      if (o) {
        oot += o; ootChars.push(c.position);
        if (THREAD_GROUPS.has(c.cls.group)) { ootThread += o; ootThreadChars.push(c.position); }
      }
      if (c.cls.group !== 'heat') nPerChar = Math.max(nPerChar, st.n);
    }
    const sh = ds.chars.find((c) => c.cls.group === 'heat' && c.cls.label === 'Oberflächenhärte');
    return {
      bcd: {
        profile, overall, nominal,
        gaussMean: useOverall ? overall.gauss.stats.mean : mean(gaussVals),
        gaussN: useOverall ? overall.gauss.stats.n : gaussVals.length, gaussFromOverall: useOverall,
        profileRange: gMeans.length > 1 ? Math.max(...gMeans) - Math.min(...gMeans) : null,
        formMean: form.length ? mean(form) : null, formN: form.length,
        formOverall: overall.huell && overall.pferch ? overall.huell.stats.mean - overall.pferch.stats.mean : null,
      },
      lead: {
        windows, mainTurns: maxTurns, mainCount: main.length, mainLength: main.length ? maxLen : null,
        mainMean: main.length ? mean(mainMeans) : null, mainLabel: main.length === 1 ? main[0].char.cls.label : null,
        pitchMean: maxTurns ? mean(main.map((w) => w.pitch)) : null,
        nominalPitch: maxTurns ? main[0].nominalPitch : null,
        spread: mainMeans.length > 1 ? Math.max(...mainMeans) - Math.min(...mainMeans) : null,
      },
      oot, ootChars, ootThread, ootThreadChars, nPerChar,
      hardness: sh ? chars.get(sh.position) || null : null,
      hardnessUnit: sh ? sh.unit : null,
    };
  }

  /**
   * Charakterisierung je Fertigungsauftrag (Batch) und gepoolt über alle einbezogenen.
   * Einzelteile werden bewusst nicht unterschieden – gepaart wird auf Batch-Ebene.
   */
  function characterize(ds, included) {
    const perOrder = new Map();
    const pooledRecs = new Map();
    for (const r of ds.records) {
      let m = perOrder.get(r.order);
      if (!m) perOrder.set(r.order, (m = new Map()));
      if (!m.has(r.position)) m.set(r.position, []);
      m.get(r.position).push(r);
      if (included.has(r.order)) {
        if (!pooledRecs.has(r.position)) pooledRecs.set(r.position, []);
        pooledRecs.get(r.position).push(r);
      }
    }
    const units = new Map();
    for (const b of ds.batches) {
      const chars = new Map();
      for (const [pos, recs] of perOrder.get(b.order) || []) chars.set(pos, describe(recs));
      units.set(b.order, { id: b.order, batch: b, included: included.has(b.order), chars, summary: summarize(ds, chars) });
    }
    const pc = new Map();
    for (const [pos, recs] of pooledRecs) pc.set(pos, describe(recs));
    const nInc = ds.batches.filter((b) => included.has(b.order)).length;
    return {
      units, order: ds.batches.map((b) => b.order), nIncluded: nInc,
      pooled: { id: 'ALL', batch: null, included: true, pooled: true, chars: pc, summary: summarize(ds, pc) },
    };
  }

  // ------------------------------------------------------------ Paarung Spindel × Mutter
  /** Bewertungen: „minmax“ = Min/Max der Einzelwerte (Standard), „cap“ = Paarungsfähigkeit Cpk_Δ. */
  const PAIR_BASES = ['minmax', 'cap'];
  const PAIR_DEFAULTS = { fit: 'gauss', basis: 'minmax', bcdLim: [15, 85], leadLim: [-25, 25], warnReserve: 5, krOffset: null, strokeFrom: null, strokeTo: null };

  // ------------------------------------------------- Paarungsfähigkeit Cpk_Δ (Bewertung „Fähigkeit“)
  // Vorgaben (CLAUDE.md, docs/entwurf-faehigkeit.md): Streuung je Auftrag; Aufträge mit < 3 Werten übernehmen die gepoolte
  // Streuung der übrigen (ν nach Smyth); untere 95-%-Grenze über Welch-Satterthwaite und Delta-Methode;
  // Status „Variante b“: außerhalb bei Cpk_Δ < 1,00, knapp bei Cpk_Δ ≥ 1,00 und unterer Grenze < 1,00, sonst ok.
  const CAP = { min: 1, conf: 0.95, minN: 3, minGroups: 3, alpha: 0.01 };

  /** Erst-/Letztstück-Versatz eines Auftrags an einem Merkmal (Welch-t-Test). Werte in der Einheit des Merkmals. */
  function erstLetzt(st, s2min) {
    if (!st || !st.tags) return null;
    const E = [], L = [];
    st.values.forEach((v, i) => { if (st.tags[i] === 'E') E.push(v); else if (st.tags[i] === 'L') L.push(v); });
    if (E.length < 2 || L.length < 2) return null;
    const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    const vr = (a, mu) => Math.max(a.reduce((x, y) => x + (y - mu) * (y - mu), 0) / (a.length - 1), s2min);
    const mE = avg(E), mL = avg(L), vE = vr(E, mE), vL = vr(L, mL);
    const qE = vE / E.length, qL = vL / L.length;
    const t = (mL - mE) / Math.sqrt(qE + qL);
    const df = (qE + qL) * (qE + qL) / (qE * qE / (E.length - 1) + qL * qL / (L.length - 1));
    const p = 2 * tCdf(-Math.abs(t), df);
    const sW = Math.sqrt(((E.length - 1) * vE + (L.length - 1) * vL) / (E.length + L.length - 2));
    return { d: mL - mE, t, df, p, nE: E.length, nL: L.length, sW, flagged: p < CAP.alpha };
  }

  /**
   * Streuung je einbezogenem Auftrag und Merkmal (Abschnitt 2.1 des Entwurfs).
   * Map(position → { byOrder: Map(id → Eintrag), pool: {s, df, k}, d0, h }), Werte in der Einheit des Merkmals (mm).
   * Eintrag: n, mean, s (roh), s2 (mit Auflösungsuntergrenze h²/12), sUsed, df, src 'own' | 'borrowed' | 'none',
   * F/fP/flagged (streut stärker als die übrigen, nur Hinweis), el (Erst-/Letztstück-Versatz, nur Hinweis).
   * Ausgeschlossene Aufträge gehen weder in die gepoolte Streuung noch in d̂₀ ein.
   */
  function spreadTable(ds, res) {
    const table = new Map();
    const units = res.order.map((id) => res.units.get(id)).filter((u) => u && u.included);
    for (const c of ds.chars) {
      const h = Math.pow(10, -(c.decimals || 0));
      const s2min = h * h / 12;
      const byOrder = new Map(), own = [];
      for (const u of units) {
        const st = u.chars.get(c.position);
        if (!st) continue;
        const s2raw = st.sd != null ? st.sd * st.sd : null;
        const e = {
          id: u.id, n: st.n, mean: st.mean, s: st.sd, s2: s2raw == null ? null : Math.max(s2raw, s2min), floored: s2raw != null && s2raw < s2min,
          values: st.values, sUsed: null, df: null, src: 'none', F: null, fP: null, sOthers: null, flagged: false, el: erstLetzt(st, s2min), pool: null, d0: null,
        };
        if (st.n >= CAP.minN) { e.sUsed = Math.sqrt(e.s2); e.df = st.n - 1; e.src = 'own'; own.push(e); }
        byOrder.set(u.id, e);
      }
      const sumDf = own.reduce((a, e) => a + e.df, 0), sumSS = own.reduce((a, e) => a + e.df * e.s2, 0);
      const pool = { s: sumDf > 0 ? Math.sqrt(sumSS / sumDf) : null, df: sumDf, k: own.length };
      const sm = smythD0(own.map((e) => e.s2), own.map((e) => e.df));
      for (const e of own) {
        const dfo = sumDf - e.df;
        if (!(dfo > 0)) continue;
        const s2o = (sumSS - e.df * e.s2) / dfo;
        e.sOthers = Math.sqrt(s2o);
        e.F = e.s2 / s2o;
        e.fP = fSf(e.F, e.df, dfo);
        e.flagged = e.fP < CAP.alpha;
      }
      if (own.length >= CAP.minGroups) {
        for (const e of byOrder.values()) if (e.src === 'none') { e.sUsed = pool.s; e.df = Math.min(sm.d0, sumDf); e.src = 'borrowed'; e.pool = pool; e.d0 = sm.d0; }
      }
      table.set(c.position, { position: c.position, byOrder, pool, d0: own.length >= 2 ? sm.d0 : null, h, s2min });
    }
    return table;
  }

  /**
   * Paarungsfähigkeit der Differenz Δ = Mutter − Spindel an einem Ort (Abschnitt 2.2). M, S: Einträge aus spreadTable
   * (Werte in mm), L…U in µm. Ergebnis in µm; null, wenn eine Streuung nicht schätzbar ist.
   */
  function capDiff(M, S, L, U) {
    if (!M || !S || M.sUsed == null || S.sUsed == null || !(M.n > 0) || !(S.n > 0)) return null;
    const sM = M.sUsed * 1000, sS = S.sUsed * 1000;
    const mu = (M.mean - S.mean) * 1000;
    const v = sM * sM + sS * sS, sd = Math.sqrt(v);
    if (!(sd > 0) || !isFinite(mu)) return null;
    const qM = isFinite(M.df) ? sM * sM * sM * sM / M.df : 0, qS = isFinite(S.df) ? sS * sS * sS * sS / S.df : 0;
    const nu = qM + qS > 0 ? v * v / (qM + qS) : Infinity;
    const nEff = v / (sM * sM / M.n + sS * sS / S.n);
    const cpkU = (U - mu) / (3 * sd), cpkL = (mu - L) / (3 * sd);
    const cpk = Math.min(cpkL, cpkU), cp = (U - L) / (6 * sd);
    const z = normInv(CAP.conf);
    const seOf = (c) => Math.sqrt(1 / (9 * nEff) + (isFinite(nu) ? c * c / (2 * nu) : 0));
    const seL = seOf(cpkL), seU = seOf(cpkU);
    const cpkLo = Math.min(cpkL - z * seL, cpkU - z * seU);
    const sp = sd * Math.sqrt(1 + 1 / nEff);
    const pPred = tCdf((L - mu) / sp, nu) + tCdf((mu - U) / sp, nu);
    const pPlug = normCdf(-3 * cpkL) + normCdf(-3 * cpkU);
    const mv = M.values || [], sv = S.values || [];
    let kOut = 0;
    for (const a of mv) for (const b of sv) { const d = (a - b) * 1000; if (d < L - EPS || d > U + EPS) kOut++; }
    return {
      mu, sd, sM, sS, nM: M.n, nS: S.n, dfM: M.df, dfS: S.df, srcM: M.src, srcS: S.src, nu, nEff, z,
      cp, cpk, cpkL, cpkU, seL, seU, cpkLo, side: cpkL <= cpkU ? 'L' : 'U',
      lo: mu - 3 * sd, hi: mu + 3 * sd, reserve: Math.min(mu - 3 * sd - L, U - mu - 3 * sd),
      sdPred: sp, pPred, pPlug, kOut, N: mv.length * sv.length,
    };
  }

  /** Status je Ort (Variante b): außerhalb bei Cpk_Δ < 1,00; knapp, wenn die untere Grenze < 1,00 (nicht nachgewiesen); sonst ok. */
  function capStatus(c) {
    if (!c || !isFinite(c.cpk) || Number.isNaN(c.cpkLo)) return 'na';
    if (c.cpk < CAP.min - EPS) return 'out';
    if (!(c.cpkLo >= CAP.min - EPS)) return 'warn';
    return 'ok';
  }

  /** Schwere eines Status für „schlechtester Ort“ und Rangfolge: außerhalb > keine Daten > knapp > ok. */
  const SEVERITY = { ok: 0, warn: 1, na: 2, out: 3 };
  /** Ist Ort a maßgeblicher als Ort b? Zuerst Status, dann kleinerer Cpk_Δ, dann kleinere untere Grenze. */
  function capWorse(a, b) {
    if (SEVERITY[a.status] !== SEVERITY[b.status]) return SEVERITY[a.status] > SEVERITY[b.status];
    const ca = a.cap ? a.cap.cpk : -Infinity, cb = b.cap ? b.cap.cpk : -Infinity;
    if (ca !== cb) return ca < cb;
    const la = a.cap ? a.cap.cpkLo : -Infinity, lb = b.cap ? b.cap.cpkLo : -Infinity;
    return la < lb;
  }

  /**
   * Zusammenfassung eines Kriteriums (BCD bzw. Steigung) einer Zelle bei „Fähigkeit“ (Abschnitt 2.4):
   * Status = schlechtester Status über alle Orte; maßgeblicher Ort nach capWorse; dazu Cpk_min, Cpk_unten,min (mit Ort),
   * Boole-Schranken für den Anteil Montagen mit mindestens einem Ort außerhalb.
   */
  function capAggregate(items) {
    const base = { items, lo: null, hi: null, reserve: null, status: 'na', nOut: 0, nWarn: 0, nNa: 0, worst: null, score: null, cpkMin: null, cpkLoMin: null, minAt: null, minLoAt: null, pMax: null, pSum: null };
    if (!items.length) return base;
    let lo = Infinity, hi = -Infinity, worst = null, minAt = null, minLoAt = null, pMax = 0, pSum = 0, any = false;
    for (const it of items) {
      const c = it.cap;
      it.status = capStatus(c);
      it.lo = c ? c.lo : null; it.hi = c ? c.hi : null; it.reserve = c ? c.reserve : null;
      if (c) {
        any = true;
        if (c.lo < lo) lo = c.lo;
        if (c.hi > hi) hi = c.hi;
        if (!minAt || c.cpk < minAt.cap.cpk) minAt = it;
        if (!minLoAt || c.cpkLo < minLoAt.cap.cpkLo) minLoAt = it;
        if (c.pPred > pMax) pMax = c.pPred;
        pSum += c.pPred;
      }
      if (!worst || capWorse(it, worst)) worst = it;
    }
    return Object.assign(base, {
      lo: any ? lo : null, hi: any ? hi : null, worst, status: worst.status, reserve: worst.reserve, score: worst.cap ? worst.cap.cpk : null,
      nOut: items.filter((i) => i.status === 'out').length, nWarn: items.filter((i) => i.status === 'warn').length, nNa: items.filter((i) => i.status === 'na').length,
      cpkMin: minAt ? minAt.cap.cpk : null, cpkLoMin: minLoAt ? minLoAt.cap.cpkLo : null, minAt, minLoAt,
      pMax: any ? pMax : null, pSum: any ? Math.min(1, pSum) : null,
    });
  }

  /** Marken am Ort: σ* = Streuung übernommen, σ! = Streuung auffällig, E/L = Versatz Erst-/Letztstücke. */
  function capFlags(eN, eS) {
    const f = { borrowed: [], sigma: [], el: [] };
    for (const [who, e] of [['Mutter', eN], ['Spindel', eS]]) {
      if (!e) continue;
      if (e.src === 'borrowed') f.borrowed.push(who);
      if (e.flagged) f.sigma.push(who);
      if (e.el && e.el.flagged) f.el.push(who);
    }
    return f;
  }

  /**
   * Geometrie der Paarung: welche Kugelrille (KR) der Mutter läuft über welchen Spindelgang.
   * Standard (Vorgabe): KR1…KRn liegen in aufeinanderfolgenden Gängen (Versatz 0, 1, 2, …), die Mutter fährt über das
   * ganze gemessene Gewinde → Gang g sieht KR k, wenn KR1 dabei zwischen Hub-Anfang und Hub-Ende steht.
   * Beispiel 17 Gänge, 4 KR: Gang 1 → KR1, Gang 3 → KR1–3, Gang 16 → KR3–4, Gang 17 → KR4.
   */
  function pairingGeometry(spDs, nuDs, o) {
    const spGangs = [...new Set(spDs.chars.filter((c) => c.cls.group === 'bcd' && c.cls.gang != null).map((c) => c.cls.gang))].sort((a, b) => a - b);
    const spLead = spDs.chars.filter((c) => c.cls.group === 'lead' && c.cls.from != null && c.nominal > 0);
    const bounds = [...spGangs, ...spLead.flatMap((c) => [c.cls.from, c.cls.to])];
    const gMin = bounds.length ? Math.min(...bounds) : 1, gMax = bounds.length ? Math.max(...bounds) : 1;
    const krs = [...new Set([
      ...nuDs.chars.filter((c) => c.cls.group === 'bcd' && c.cls.kr != null).map((c) => c.cls.kr),
      ...nuDs.chars.filter((c) => c.cls.group === 'lead' && c.cls.fromKr != null).flatMap((c) => [c.cls.fromKr, c.cls.toKr]),
    ])].sort((a, b) => a - b);
    const off = new Map(krs.map((k, i) => {
      const v = o.krOffset && o.krOffset[k] != null && isFinite(o.krOffset[k]) ? Number(o.krOffset[k]) : i;
      return [k, v];
    }));
    // Hub = Lage der ersten KR (KR1); Versatz der übrigen KR relativ dazu
    const off1 = krs.length ? off.get(krs[0]) : 0;
    const rel = (k) => off.get(k) - off1;
    const relMax = krs.length ? Math.max(...krs.map(rel)) : 0, relMin = krs.length ? Math.min(...krs.map(rel)) : 0;
    const strokeFrom = o.strokeFrom != null && isFinite(o.strokeFrom) ? Number(o.strokeFrom) : gMin - relMin;
    const strokeTo = o.strokeTo != null && isFinite(o.strokeTo) ? Number(o.strokeTo) : gMax - relMax;
    const sees = (g, k) => { const s = g - rel(k); return s >= strokeFrom - EPS && s <= strokeTo + EPS; };
    const visibility = spGangs.map((g) => ({ gang: g, krs: krs.filter((k) => sees(g, k)) }));
    const nuLead = nuDs.chars.filter((c) => c.cls.group === 'lead' && c.cls.from != null && c.nominal > 0);
    // verglichen werden Fenster gleicher Nennlänge (Mutter KR1–KR4 17,4 mm ↔ Spindel G1–G7 … 17,4 mm)
    const leadPairs = nuLead.map((n) => ({ nut: n, sp: spLead.filter((s) => Math.abs(s.nominal - n.nominal) < 1e-9) }));
    return { spGangs, krs, off, gMin, gMax, strokeFrom, strokeTo, visibility, leadPairs, spLead, nuLead, sees };
  }

  /**
   * Rangfolge eines Kriteriums für „ungünstigstes Paar“ und Startauswahl (kleiner = ungünstiger).
   * Min/Max: Reserve. Fähigkeit: zuerst Status (außerhalb vor knapp vor ok), dann Cpk_Δ; „keine Daten“ zählt hier nicht.
   */
  function critRank(a, basis) {
    if (!a || !a.worst) return [Infinity, Infinity];
    if (basis !== 'cap') return [0, a.reserve];
    if (a.status === 'na' || a.score == null) return [Infinity, Infinity];
    return [3 - SEVERITY[a.status], a.score];
  }
  const rankLess = (x, y) => x[0] < y[0] || (x[0] === y[0] && x[1] < y[1]);

  /**
   * Paarungsmatrix: alle einbezogenen Spindel-Aufträge × alle einbezogenen Mutter-Aufträge.
   * Δ = Mutter − Spindel in µm. BCD je sichtbarem Paar Gang/KR mit gewählter Auswertung (Gauss/Hüll/Pferch),
   * Steigung je Mutterfenster gegen alle Spindelfenster gleicher Nennlänge.
   * Bewertung „minmax“ (Standard): ungünstigste Einzelteile (Min Mutter − Max Spindel … Max Mutter − Min Spindel), Status über die Reserve.
   * Bewertung „cap“: Paarungsfähigkeit Cpk_Δ je Ort (capDiff), Status nach capStatus; lo/hi = μΔ ± 3σΔ.
   * Jeder Ort trägt immer mm = {lo, hi} (Min/Max) und mid (Differenz der Auftragsmittel).
   */
  function pairing(sp, nu, opts) {
    const o = Object.assign({}, PAIR_DEFAULTS, opts || {});
    if (!PAIR_BASES.includes(o.basis)) o.basis = PAIR_DEFAULTS.basis;
    const cap = o.basis === 'cap';
    const geo = pairingGeometry(sp.ds, nu.ds, o);
    const [bLo, bHi] = o.bcdLim, [lLo, lHi] = o.leadLim;
    const um = (x) => x * 1000;
    const spread = cap ? { sp: spreadTable(sp.ds, sp.res), nu: spreadTable(nu.ds, nu.res) } : null;
    const used = { sp: new Set(), nu: new Set() };
    const base = (a, b) => {
      const mm = { lo: um(a.min - b.max), hi: um(a.max - b.min) };
      return { mm, lo: mm.lo, hi: mm.hi, mid: um(a.mean - b.mean) };
    };
    const withCap = (it, nuPos, spPos, unId, usId, L, H) => {
      used.nu.add(nuPos); used.sp.add(spPos);
      if (!cap) return it;
      const tN = spread.nu.get(nuPos), tS = spread.sp.get(spPos);
      it.nutSpread = tN ? tN.byOrder.get(unId) || null : null;
      it.spSpread = tS ? tS.byOrder.get(usId) || null : null;
      it.cap = capDiff(it.nutSpread, it.spSpread, L, H);
      it.flags = capFlags(it.nutSpread, it.spSpread);
      return it;
    };
    const reserveOf = (lo, hi, L, H) => Math.min(lo - L, H - hi);
    const statusOf = (r) => (r < -EPS ? 'out' : r < o.warnReserve - EPS ? 'warn' : 'ok');
    const aggMinMax = (items, L, H) => {
      if (!items.length) return { items, lo: null, hi: null, reserve: null, status: 'na', nOut: 0, nWarn: 0, worst: null, score: null };
      let lo = Infinity, hi = -Infinity, worst = null;
      for (const it of items) {
        it.reserve = reserveOf(it.lo, it.hi, L, H);
        it.status = statusOf(it.reserve);
        if (it.lo < lo) lo = it.lo;
        if (it.hi > hi) hi = it.hi;
        if (!worst || it.reserve < worst.reserve) worst = it;
      }
      const reserve = worst.reserve;
      return { items, lo, hi, reserve, status: statusOf(reserve), nOut: items.filter((i) => i.status === 'out').length, nWarn: items.filter((i) => i.status === 'warn').length, worst, score: reserve };
    };
    const agg = (items, L, H) => (cap ? capAggregate(items) : aggMinMax(items, L, H));
    const spU = sp.res.order.map((x) => sp.res.units.get(x)).filter((u) => u.included);
    const nuU = nu.res.order.map((x) => nu.res.units.get(x)).filter((u) => u.included);
    const cells = new Map();
    const counts = { pairs: 0, bcdOut: 0, bcdWarn: 0, leadOut: 0, leadWarn: 0, bothOk: 0, bcdNa: 0, leadNa: 0, incomplete: 0 };
    let worstBcd = null, worstLead = null, minCapBcd = null, minCapLead = null;
    for (const us of spU) {
      const spProf = new Map(us.summary.bcd.profile.map((p) => [p.gang, p]));
      for (const un of nuU) {
        const nuProf = new Map(un.summary.bcd.profile.filter((p) => p.kr != null).map((p) => [p.kr, p]));
        const bcd = [];
        for (const v of geo.visibility) {
          const b = spProf.get(v.gang);
          if (!b || !b[o.fit]) continue;
          for (const k of v.krs) {
            const a = nuProf.get(k);
            if (!a || !a[o.fit]) continue;
            const it = Object.assign({ gang: v.gang, kr: k, nut: a[o.fit], sp: b[o.fit] }, base(a[o.fit].stats, b[o.fit].stats));
            bcd.push(withCap(it, a[o.fit].char.position, b[o.fit].char.position, un.id, us.id, bLo, bHi));
          }
        }
        const lead = [];
        for (const lp of geo.leadPairs) {
          const a = un.chars.get(lp.nut.position);
          if (!a) continue;
          for (const s of lp.sp) {
            const b = us.chars.get(s.position);
            if (!b) continue;
            const it = Object.assign({ nutChar: lp.nut, spChar: s, nutStats: a, spStats: b }, base(a, b));
            lead.push(withCap(it, lp.nut.position, s.position, un.id, us.id, lLo, lHi));
          }
        }
        const cell = { key: us.id + '|' + un.id, s: us, n: un, bcd: agg(bcd, bLo, bHi), lead: agg(lead, lLo, lHi) };
        const sts = [cell.bcd.status, cell.lead.status];
        cell.status = sts.includes('out') ? 'out' : sts.includes('na') ? 'na' : sts.includes('warn') ? 'warn' : 'ok';
        cell.rank = rankLess(critRank(cell.lead, o.basis), critRank(cell.bcd, o.basis)) ? critRank(cell.lead, o.basis) : critRank(cell.bcd, o.basis);
        cells.set(cell.key, cell);
        counts.pairs++;
        if (cell.bcd.status === 'out') counts.bcdOut++; else if (cell.bcd.status === 'warn') counts.bcdWarn++;
        if (cell.lead.status === 'out') counts.leadOut++; else if (cell.lead.status === 'warn') counts.leadWarn++;
        if (cell.status === 'ok') counts.bothOk++;
        if (cell.bcd.status === 'na') counts.bcdNa++;
        if (cell.lead.status === 'na') counts.leadNa++;
        if (cell.status === 'na') counts.incomplete++;
        if (cell.bcd.worst && isFinite(critRank(cell.bcd, o.basis)[0]) && (!worstBcd || rankLess(critRank(cell.bcd, o.basis), critRank(worstBcd.bcd, o.basis)))) worstBcd = cell;
        if (cell.lead.worst && isFinite(critRank(cell.lead, o.basis)[0]) && (!worstLead || rankLess(critRank(cell.lead, o.basis), critRank(worstLead.lead, o.basis)))) worstLead = cell;
        if (cap) {
          if (cell.bcd.cpkMin != null && (!minCapBcd || cell.bcd.cpkMin < minCapBcd.bcd.cpkMin)) minCapBcd = cell;
          if (cell.lead.cpkMin != null && (!minCapLead || cell.lead.cpkMin < minCapLead.lead.cpkMin)) minCapLead = cell;
        }
      }
    }
    // Startauswahl: das ungünstigste Paar über beide Kriterien
    let worst = null;
    for (const c of cells.values()) if (isFinite(c.rank[0]) && (!worst || rankLess(c.rank, worst.rank))) worst = c;
    // „passend“ = beide Kriterien bewertet und keines außerhalb
    const fits = (c) => c.status === 'ok' || c.status === 'warn';
    const rowOk = new Map(spU.map((us) => [us.id, nuU.filter((un) => fits(cells.get(us.id + '|' + un.id))).length]));
    const colOk = new Map(nuU.map((un) => [un.id, spU.filter((us) => fits(cells.get(us.id + '|' + un.id))).length]));
    return { opts: o, geo, spU, nuU, cells, counts, worstBcd, worstLead, minCapBcd, minCapLead, worst, rowOk, colOk, spread, used };
  }

  /** Ort eines Paarungsvergleichs als Text: „Gang 17/KR4“ bzw. „KR1–KR4 / G1–G7“. */
  const pairLoc = (it) => (!it ? '' : it.gang != null ? `Gang ${it.gang}/KR${it.kr}` : `${it.nutChar.cls.label.replace('Steigung ', '')} / ${it.spChar.cls.label.replace('Steigung ', '')}`);
  /** Rundung zur Grenze hin: Cpk abrunden (konsistent mit der Status-Toleranz EPS), Anteile aufrunden. */
  const floorTo = (v, d) => { const k = Math.pow(10, d); return Math.floor((v + EPS) * k + 1e-9) / k; };
  const ceilSig = (v, sig) => {
    if (!(v > 0)) return v === 0 ? 0 : v;
    const k = Math.pow(10, sig - 1 - Math.floor(Math.log10(v)));
    return Math.ceil(v * k * (1 - 1e-12)) / k;
  };

  /** Paarungsmatrix als CSV (Semikolon, Dezimalkomma). Kopfzeile bei beiden Bewertungen gleich; Fähigkeits-Spalten nur bei „Fähigkeit“ gefüllt. */
  function exportPairingCSV(pm, spDs, nuDs) {
    const dec = (v) => (v == null || !isFinite(v) ? '' : String(+v.toFixed(3)).replace('.', ','));
    const ST = { ok: 'ok', warn: 'knapp', out: 'außerhalb', na: 'keine Daten' };
    // Anzeige-Rundung zur Grenze hin (wie in der Oberfläche), damit Status und Zahl nie widersprechen
    const fl = (v) => (v == null || !isFinite(v) ? '' : String(Math.floor(v * 1000 + 1e-9) / 1000).replace('.', ','));
    const flC = (v) => (v == null || !isFinite(v) ? '' : String(floorTo(v, 3)).replace('.', ','));
    const ppm = (p) => (p == null || !isFinite(p) ? '' : String(ceilSig(p * 1e6, 3)).replace('.', ','));
    const nuS = (v) => (v == null ? '' : !isFinite(v) ? 'unendlich' : dec(v));
    const pS = (p) => (p < 0.001 ? '< 0,001' : dec(p));
    const FL = { gauss: 'Gauss', huell: 'Hüll', pferch: 'Pferch' };
    const SRC = { own: 'eigene', borrowed: 'übernommen', none: 'nicht schätzbar' };
    const o = pm.opts, cap = o.basis === 'cap';
    const capHead = (p) => [`${p}_Cpk`, `${p}_Cpk_unten`, `${p}_Ort`, `${p}_muDelta_um`, `${p}_sigmaDelta_um`, `${p}_sigma_Mutter_um`, `${p}_sigma_Spindel_um`, `${p}_nu`,
      `${p}_Anteil_ppm`, `${p}_Anteil_ppm_max`, `${p}_Anteil_ppm_Summe`, `${p}_k_ausserhalb`, `${p}_N_Kombinationen`, `${p}_Streuung_Quelle`, `${p}_Hinweise`];
    const notes = (it) => {
      const r = [];
      const f = it.flags;
      if (f.borrowed.length) r.push(`Streuung übernommen (${f.borrowed.join(', ')})`);
      for (const [who, e] of [['Mutter', it.nutSpread], ['Spindel', it.spSpread]]) {
        if (e && e.flagged) r.push(`Streuung auffällig ${who} (F-Test p ${pS(e.fP)})`);
        if (e && e.el && e.el.flagged) r.push(`Erst/Letzt-Versatz ${who} ${dec(e.el.d * 1000)} µm (p ${pS(e.el.p)})`);
      }
      return r.join(' · ');
    };
    const capCols = (a) => {
      const it = a.worst, c = it && it.cap;
      if (!cap || !it) return capHead('x').map(() => '');
      const src = it.nutSpread || it.spSpread ? `Mutter ${SRC[it.nutSpread ? it.nutSpread.src : 'none']} / Spindel ${SRC[it.spSpread ? it.spSpread.src : 'none']}` : '';
      if (!c) return ['', '', pairLoc(it), '', '', '', '', '', '', '', '', '', '', src, notes(it)];
      return [flC(c.cpk), flC(c.cpkLo), pairLoc(it), dec(c.mu), dec(c.sd), dec(c.sM), dec(c.sS), nuS(c.nu),
        ppm(c.pPred), ppm(a.pMax), ppm(a.pSum), String(c.kOut), String(c.N), src, notes(it)];
    };
    const head = ['Spindel_Material', 'Spindel_Auftrag', 'Spindel_Charge', 'Mutter_Material', 'Mutter_Auftrag', 'Mutter_Charge', 'Auswertung', 'Bewertung',
      'BCD_Grenze_min_um', 'BCD_Grenze_max_um', 'dBCD_min_um', 'dBCD_max_um', 'BCD_Reserve_um', 'BCD_Status', 'BCD_knappstes_Paar',
      'Steigung_Grenze_um', 'dL_min_um', 'dL_max_um', 'Steigung_Reserve_um', 'Steigung_Status', 'Steigung_knappstes_Fenster',
      ...capHead('BCD'), ...capHead('Stg')];
    const out = [head.join(';')];
    for (const us of pm.spU) for (const un of pm.nuU) {
      const c = pm.cells.get(us.id + '|' + un.id);
      out.push([spDs.material, us.id, us.batch.batchNo, nuDs.material, un.id, un.batch.batchNo, FL[o.fit], cap ? `Fähigkeit (Cpk_Δ, ${Math.round(CAP.conf * 100)} %)` : 'Min/Max Einzelwerte',
        dec(o.bcdLim[0]), dec(o.bcdLim[1]), dec(c.bcd.lo), dec(c.bcd.hi), fl(c.bcd.reserve), ST[c.bcd.status], pairLoc(c.bcd.worst),
        `±${dec(o.leadLim[1])}`, dec(c.lead.lo), dec(c.lead.hi), fl(c.lead.reserve), ST[c.lead.status], pairLoc(c.lead.worst),
        ...capCols(c.bcd), ...capCols(c.lead),
      ].join(';'));
    }
    return out.join('\r\n') + '\r\n';
  }

  /** Kennwerte als CSV für Excel (Semikolon, Dezimalkomma). */
  function exportCSV(ds, res) {
    const dec = (v) => (v == null || !isFinite(v) ? '' : String(+v.toPrecision(12)).replace('.', ','));
    const txt = (s) => { s = s == null ? '' : String(s); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ['Teil', 'Material', 'Prozess', 'Einheit', 'Fertigungsauftrag', 'Charge', 'einbezogen', 'Position', 'Merkmal', 'Gruppe', 'Lage', 'Masseinheit', 'Nennmass', 'UGW', 'OGW', 'n', 'Mittelwert', 's', 'Min', 'Max', 'n_unter_UGW', 'n_ueber_OGW'];
    const out = [head.join(';')];
    const gl = Object.fromEntries(GROUPS.map((g) => [g.id, g.label]));
    const units = [res.pooled, ...res.order.map((o) => res.units.get(o))];
    const lage = (c) => {
      if (c.cls.kr != null) return `KR${c.cls.kr}`;
      if (c.cls.fromKr != null) return `KR${c.cls.fromKr}-KR${c.cls.toKr}`;
      if (c.cls.overall) return 'gesamt';
      if (c.cls.gang != null) return String(c.cls.gang);
      if (c.cls.from != null) return `${c.cls.from}-${c.cls.to}`;
      return '';
    };
    for (const u of units) {
      for (const c of ds.charsGrouped) {
        const st = u.chars.get(c.position);
        if (!st) continue;
        out.push([
          TYPE_LABEL[ds.partType] || '', txt(ds.material), txt(ds.process), u.pooled ? `gepoolt (${res.nIncluded} Aufträge)` : 'Batch',
          txt(u.pooled ? '' : u.id), txt(u.pooled ? '' : u.batch.batchNo), u.included ? 'ja' : 'nein',
          txt(c.position), txt(c.cls.label), txt(gl[c.cls.sub]), txt(lage(c)),
          txt(c.unit), dec(c.nominal), dec(c.lsl), dec(c.usl), st.n, dec(st.mean), dec(st.sd), dec(st.min), dec(st.max), st.below, st.above,
        ].join(';'));
      }
    }
    return out.join('\r\n') + '\r\n';
  }

  return {
    decodeBytes, detectDelimiter, parseCSV, decodeR, fixMojibake, parseNum, decimalsOf, parseTs,
    Issues, parseCAQ, detectPartType, classify, buildModel, describe, summarize, characterize, exportCSV,
    pairingGeometry, pairing, exportPairingCSV, PAIR_DEFAULTS, splitByPartType,
    GROUPS, THREAD_GROUPS, FIT_LABEL, TYPE_LABEL, fmtDay,
    lnGamma, erfc, normCdf, normInv, betaI, tCdf, fCdf, fSf, digamma, trigamma, trigammaInv, smythD0,
    CAP, PAIR_BASES, SEVERITY, spreadTable, erstLetzt, capDiff, capStatus, capAggregate, capFlags, pairLoc, floorTo, ceilSig,
  };
})();
</script>

<script id="app">
(function () {
  'use strict';
  const C = globalThis.SubCore;
  const $ = (id) => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';
  const FITS = ['gauss', 'huell', 'pferch'];
  const PART = {
    spindel: { label: 'Spindel', gen: 'der Spindel' },
    mutter: { label: 'Mutter', gen: 'der Mutter' },
  };
  const lsKey = (part) => `subtracteract.${part}.excluded.v1`;

  function makeState(part) {
    return {
      part, files: [], model: null, dsId: null, ds: null, res: null, notice: null,
      excluded: loadExcluded(part), sel: 'ALL', cmp: null, mapOpen: false, filter: '', onlyOut: false,
      show: { gauss: true, huell: true, pferch: true, ctx: true },
    };
  }
  function loadExcluded(part) { try { return new Set(JSON.parse(localStorage.getItem(lsKey(part)) || '[]')); } catch (e) { return new Set(); } }
  function saveExcluded() { try { localStorage.setItem(lsKey(state.part), JSON.stringify([...state.excluded])); } catch (e) { /* ohne Speicher weiter */ } }
  const states = { spindel: makeState('spindel'), mutter: makeState('mutter') };
  let state = states.spindel;
  let view = 'spindel'; // 'spindel' | 'mutter' | 'paarung'
  const PAIR_KEY = 'subtracteract.paarung.v1';
  const pair = { opts: loadPairOpts(), sel: null, pm: null, geoOpen: false, hintsOpen: true, calcOpen: false };
  /** Gespeicherte Einstellungen laden; ungültige oder veraltete Werte (z. B. die entfernte Bewertung „Mittelwerte“) fallen auf den Standard zurück. */
  function loadPairOpts() {
    const D = C.PAIR_DEFAULTS;
    let o;
    try { o = Object.assign({}, D, JSON.parse(localStorage.getItem(PAIR_KEY) || '{}')); } catch (e) { o = Object.assign({}, D); }
    if (!C.PAIR_BASES.includes(o.basis)) o.basis = D.basis;
    if (!FITS.includes(o.fit)) o.fit = D.fit;
    const lim = (v) => Array.isArray(v) && v.length === 2 && v.every((x) => typeof x === 'number' && isFinite(x)) && v[0] < v[1];
    if (!lim(o.bcdLim)) o.bcdLim = D.bcdLim.slice();
    if (!lim(o.leadLim)) o.leadLim = D.leadLim.slice();
    if (!(typeof o.warnReserve === 'number' && o.warnReserve >= 0)) o.warnReserve = D.warnReserve;
    return o;
  }
  function savePairOpts() { try { localStorage.setItem(PAIR_KEY, JSON.stringify(pair.opts)); } catch (e) { /* ohne Speicher weiter */ } }
  const isNut = () => state.ds && state.ds.partType === 'mutter';
  /** Beschriftung einer Position auf der Gewindeachse: Spindel = Gang, Mutter = Kugelrille. */
  function posLabel(x, long) {
    if (isNut() && state.ds.krAt) {
      for (const [kr, g] of state.ds.krAt) if (g === x) return long && state.ds.krGeometryDerived ? `KR${kr} · Gang ${g}` : `KR${kr}`;
    }
    return long ? `Gang ${x}` : String(x);
  }

  // ------------------------------------------------------------ Helfer
  function h(tag, attrs, ...children) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
    return e;
  }
  function s(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const NF = {};
  const nf = (d) => NF[d] || (NF[d] = new Intl.NumberFormat('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }));
  function fmt(v, d) {
    if (v == null || !isFinite(v)) return '–';
    if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
    return (v < 0 ? '−' : '') + nf(d).format(Math.abs(v));
  }
  function fmtS(v, d) {
    if (v == null || !isFinite(v)) return '–';
    if (Math.abs(v) < 0.5 * Math.pow(10, -d)) return '±' + nf(d).format(0);
    return (v > 0 ? '+' : '−') + nf(d).format(Math.abs(v));
  }
  const um = (mm) => (mm == null ? null : mm * 1000);
  /** Anzeigegenauigkeit: Messauflösung, bei mm höchstens 4 Stellen (0,1 µm), sonst höchstens 3. */
  const dp = (c) => Math.min(c.decimals, c.unit === 'mm' ? 4 : 3);
  const plGang = (n) => (n == null ? '? Gänge' : `${n} ${n === 1 ? 'Gang' : 'Gänge'}`);
  const plWert = (n) => `${nf(0).format(n)} ${n === 1 ? 'Wert' : 'Werte'}`;
  const fmtDay = (ms) => (ms == null ? '–' : C.fmtDay(ms));
  const tolText = (c, d) => (c.lsl != null && c.usl != null ? `${fmt(c.lsl, d)} … ${fmt(c.usl, d)}` : c.usl != null ? `≤ ${fmt(c.usl, d)}` : c.lsl != null ? `≥ ${fmt(c.lsl, d)}` : 'ohne Toleranz');
  const selUnit = () => (state.sel === 'ALL' ? state.res.pooled : state.res.units.get(state.sel));
  const unitTitle = (u) => (u.pooled ? `Alle einbezogenen Fertigungsaufträge (gepoolt, ${state.res.nIncluded})` : `Fertigungsauftrag ${u.id} · Charge ${u.batch.batchNo || '–'}`);

  // ------------------------------------------------------------ Laden
  const drop = $('drop'), input = $('file');
  drop.addEventListener('click', () => input.click());
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach((t) => window.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'dragend'].forEach((t) => window.addEventListener(t, (e) => { if (!e.relatedTarget) drop.classList.remove('over'); }));
  window.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  async function addFiles(fileList) {
    const parsedList = [];
    for (const f of [...fileList]) {
      let parsed;
      try {
        const { text, encoding } = C.decodeBytes(await f.arrayBuffer());
        parsed = C.parseCAQ(text, f.name);
        parsed.encoding = encoding;
      } catch (err) {
        parsed = { fileName: f.name, fatal: 'Datei konnte nicht gelesen werden: ' + err.message, records: [], issues: new C.Issues(), rowCount: 0 };
      }
      parsed.size = f.size;
      parsedList.push(...C.splitByPartType(parsed));
    }
    addParsed(parsedList);
  }
  /** Dateien dem passenden Reiter zuordnen (Spindel/Mutter automatisch erkannt). */
  function addParsed(parsedList) {
    const touched = new Set(), moved = [];
    for (const p of parsedList) {
      const target = p.partType || state.part;
      const st = states[target];
      st.files = st.files.filter((x) => x.fileName !== p.fileName); // gleicher Name im selben Reiter = neuere Fassung
      st.files.push(p);
      touched.add(target);
      if (target !== state.part) moved.push({ name: p.fileName, target });
    }
    const current = state.part;
    for (const part of touched) {
      const st = states[part];
      const arrived = moved.filter((m) => m.target === part);
      st.notice = arrived.length ? `${arrived.map((m) => m.name).join(', ')} ${arrived.length === 1 ? 'wurde' : 'wurden'} als ${PART[part].label}-Export erkannt und hier abgelegt.` : null;
      state = st;
      rebuild();
    }
    state = states[current];
    if (view === 'paarung') { switchPart('paarung'); return; }
    const onlyOther = parsedList.length && moved.length === parsedList.length;
    switchPart(onlyOther ? moved[0].target : current);
  }
  function reset() { state.files = []; state.sel = 'ALL'; state.notice = null; rebuild(); renderSteps(); }

  function switchPart(part) {
    hideTip();
    if (part === 'paarung') {
      view = 'paarung';
      renderSteps(); renderFileBar();
      for (const id of ['reportSec', 'batchSec', 'profileSec', 'compareSec', 'statsSec']) $(id).hidden = true;
      renderPairing();
      return;
    }
    view = part;
    state = states[part];
    $('pairSec').hidden = true; $('pairDetailSec').hidden = true;
    renderSteps();
    renderFileBar(); renderReport(); renderAnalysis();
  }
  function renderSteps() {
    document.title = `Subtracteract · ${view === 'paarung' ? 'Paarung' : PART[view].label}`;
    for (const b of document.querySelectorAll('#steps button.step')) {
      const part = b.dataset.part, on = part === view;
      b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      if (part === 'paarung') { b.replaceChildren('3 · Paarung'); continue; }
      const n = states[part].files.length;
      b.replaceChildren(...[`${part === 'spindel' ? 1 : 2} · ${PART[part].label}`, n ? h('span', { class: 'cnt', title: `${n} Datei(en) geladen`, text: String(n) }) : null].filter(Boolean));
    }
  }
  document.querySelectorAll('#steps button.step').forEach((b) => b.addEventListener('click', () => switchPart(b.dataset.part)));

  function rebuild() {
    state.model = state.files.length ? C.buildModel(state.files, state.part) : null;
    const dss = state.model ? state.model.datasets : [];
    if (!dss.some((d) => d.id === state.dsId)) state.dsId = dss.length ? dss[0].id : null;
    recompute(true);
  }
  function recompute(withReport) {
    state.ds = (state.model && state.model.datasets.find((d) => d.id === state.dsId)) || null;
    state.res = null;
    if (state.ds) {
      const inc = new Set(state.ds.batches.map((b) => b.order).filter((o) => !state.excluded.has(o)));
      state.res = C.characterize(state.ds, inc);
      if (state.sel !== 'ALL' && !state.res.units.has(state.sel)) state.sel = 'ALL';
      if (!state.cmp || !state.ds.charMap.has(state.cmp)) {
        const first = state.ds.charsGrouped.find((c) => c.cls.group === 'lead') || state.ds.charsGrouped[0];
        state.cmp = first ? first.position : null;
      }
    }
    if (view === 'paarung') { renderSteps(); return; }
    if (withReport) { renderFileBar(); renderReport(); }
    renderAnalysis();
    renderSteps();
  }

  // ------------------------------------------------------------ Analyse
  function renderAnalysis() {

  }
  function select(id) { state.sel = id; renderAnalysis(); }

  // ------------------------------------------------------------ Batches
  function renderBatches() {
    const sec = $('batchSec'), ds = state.ds, res = state.res;
    const bcdNom = (res.pooled.summary.bcd.nominal ?? ds.chars.find((c) => c.cls.group === 'bcd')?.nominal) ?? null;
    const shUnit = res.pooled.summary.hardnessUnit || '';

          h('th', { class: 'num', text: 'n je Merkmal' }), h('th', { class: 'num', text: 'BCD Gauss x̄ [mm]' }), h('th', { class: 'num', text: 'Δ Nenn [µm]' }),
