    if (hasBcd) drawBcd(bcdBox, u);
    if (hasLead) drawLead(leadBox, u);
  }

  /** Legenden-Symbol (Mark-Spiegel). */
  function glyph(kind) {
    const g = s('svg', { width: 18, height: 12, viewBox: '0 0 18 12', 'aria-hidden': 'true', class: 'glyph' });
    if (kind === 'gauss') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--s1)', 'stroke-width': 2 }, g); s('circle', { cx: 9, cy: 6, r: 3.5, fill: 'var(--s1)' }, g); }
    else if (kind === 'huell') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--s2)', 'stroke-width': 1.5 }, g); s('path', { d: triPath(9, 6, 4.5, true), fill: 'var(--s2)' }, g); }
    else if (kind === 'pferch') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--s3)', 'stroke-width': 1.5 }, g); s('path', { d: triPath(9, 6, 4.5, false), fill: 'var(--s3)' }, g); }
    else if (kind === 'ctx') s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--ctx)', 'stroke-width': 1.5 }, g);
    else if (kind === 'band') { s('rect', { x: 1, y: 2, width: 16, height: 8, fill: 'var(--tolband)' }, g); s('line', { x1: 1, x2: 17, y1: 2, y2: 2, class: 'tolline' }, g); s('line', { x1: 1, x2: 17, y1: 10, y2: 10, class: 'tolline' }, g); }
    else if (kind === 'tol2') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, class: 'tolline2' }, g); }
    else if (kind === 'overall') { s('line', { x1: 1, x2: 17, y1: 6, y2: 6, stroke: 'var(--s1)', 'stroke-width': 1.5, 'stroke-dasharray': '5 3' }, g); }
    return g;
  }
  function triPath(cx, cy, r, up) {
    const k = up ? 1 : -1;
    return `M${cx},${cy - k * r}L${cx + r * 0.95},${cy + k * r * 0.65}L${cx - r * 0.95},${cy + k * r * 0.65}Z`;
  }

  // ------------------------------------------------------------ Diagramm-Grundlagen
  function lin(d0, d1, r0, r1) { const k = (r1 - r0) / (d1 - d0 || 1); const f = (v) => r0 + (v - d0) * k; f.inv = (p) => d0 + (p - r0) / k; return f; }
  function niceStep(span, count) {
    const raw = span / Math.max(1, count), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }
  function niceDomain(vals, count) {
    let min = Math.min(...vals), max = Math.max(...vals);
    if (!isFinite(min)) { min = 0; max = 1; }
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.05; min -= pad; max += pad;
    const st = niceStep(max - min, count);
    const d = [Math.floor(min / st + 1e-9) * st, Math.ceil(max / st - 1e-9) * st];
    const t = [];
    for (let v = d[0]; v <= d[1] + st * 1e-6; v += st) t.push(+v.toFixed(10));
    return { domain: d, ticks: t, step: st };
  }
  function decimalsForStep(st) { return Math.max(0, -Math.floor(Math.log10(st) + 1e-9)); }

  /** Skalierung gegenüber 14 px Grundschrift (Full HD 15 px, 4K 17–20 px) – Diagramm-Geometrie wächst mit. */
  function rootScale() { return (parseFloat(getComputedStyle(document.documentElement).fontSize) || 14) / 14; }
  const isWide = () => window.matchMedia('(min-width:1600px)').matches;
  /** Diagrammhöhe: auf großen Bildschirmen an die Fensterhöhe angelehnt, damit Diagramme nicht flach wirken. */
  function chartHeight(base) {
    const k = rootScale();
    if (!isWide()) return Math.round(base * k);
    return Math.round(Math.max(base * k, Math.min(window.innerHeight * 0.44, base * k * 1.7)));
  }

  function frame(host, o) {
    const k = rootScale();
    const W = Math.max(300, Math.floor(host.clientWidth || 640)), H = o.height || 300;
    const m = { l: (o.ml || 48) * k, r: 14 * k, t: 12 * k, b: (o.mb || 34) * k };
    const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': o.aria, tabindex: 0 });
    host.replaceChildren(svg);
    const x = lin(o.x[0], o.x[1], m.l, W - m.r), y = lin(o.y[0], o.y[1], H - m.b, m.t);
    const grid = s('g', { class: 'grid' }, svg);
    for (const t of o.yTicks) {
      s('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }, grid);
      s('text', { x: m.l - 8 * k, y: y(t), 'text-anchor': 'end', 'dominant-baseline': 'middle', class: 'tick' }, svg).textContent = o.yFmt(t);
    }
    s('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis' }, svg);
    for (const t of o.xTicks || []) {
      s('line', { x1: x(t.v), x2: x(t.v), y1: H - m.b, y2: H - m.b + 4 * k, class: 'axis' }, svg);
      s('text', { x: x(t.v), y: H - m.b + 16 * k, 'text-anchor': 'middle', class: 'tick' }, svg).textContent = t.label;
    }
    if (o.xTitle) s('text', { x: m.l, y: H - m.b + 16 * k, 'text-anchor': 'end', dx: -8 * k, class: 'tick' }, svg).textContent = o.xTitle;
    const plot = s('g', null, svg);
    return { svg, plot, x, y, W, H, m, k };
  }

  // Tooltip
  const tip = $('tip');
  function showTip(node, pt) {
    tip.replaceChildren(node);
    tip.hidden = false;
    const r = tip.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    let left = pt.x + 14, top = pt.y + 14;
    if (left + r.width > vw - 8) left = pt.x - r.width - 14;
    if (left < 8) left = 8;
    if (top + r.height > vh - 8) top = pt.y - r.height - 14;
    if (top < 8) top = 8;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  function hideTip() { tip.hidden = true; }
  function tipBox(title, rows, foot) {
    return h('div', null, h('div', { class: 'tip-title', text: title }),
      rows.map((r) => h('div', { class: 'tip-row' }, h('span', { class: 'lk ' + (r.key ? 'k-' + r.key : 'none') }), h('strong', { text: r.value }), h('span', { class: 'tip-label', text: r.label }))),
      foot ? [].concat(foot).filter(Boolean).map((f) => h('div', { class: 'tip-foot', text: f })) : null);
  }

  /** Fadenkreuz: rastet auf die nächste Position ein; Tastatur ← → und Esc. */
  function crosshair(f, points, build, onPick) {
    const line = s('line', { class: 'cross', y1: f.m.t, y2: f.H - f.m.b, visibility: 'hidden' }, f.svg);
    const hit = s('rect', { x: f.m.l, y: 0, width: f.W - f.m.l - f.m.r, height: f.H, fill: 'transparent', style: onPick ? 'cursor:pointer' : null }, f.svg);
    let cur = -1;
    const nearest = (clientX) => {
      const px = clientX - f.svg.getBoundingClientRect().left;
      let best = 0, bd = Infinity;
      points.forEach((p, i) => { const d = Math.abs(p.x - px); if (d < bd) { bd = d; best = i; } });
      return best;
    };
    const show = (i, pt) => {
      cur = i;
      const p = points[i];
      line.setAttribute('x1', p.x); line.setAttribute('x2', p.x); line.setAttribute('visibility', 'visible');
      const r = f.svg.getBoundingClientRect();
      showTip(build(i), pt || { x: r.left + p.x, y: r.top + f.m.t + 24 * f.k });
    };
    const hide = () => { cur = -1; line.setAttribute('visibility', 'hidden'); hideTip(); };
    hit.addEventListener('pointermove', (e) => show(nearest(e.clientX), { x: e.clientX, y: e.clientY }));
    hit.addEventListener('pointerdown', (e) => show(nearest(e.clientX), { x: e.clientX, y: e.clientY }));
    hit.addEventListener('pointerleave', hide);
    if (onPick) hit.addEventListener('click', (e) => onPick(nearest(e.clientX)));
    f.svg.addEventListener('keydown', (e) => {
      const n = points.length;
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); show(cur < 0 ? 0 : (cur + (e.key === 'ArrowRight' ? 1 : n - 1)) % n); }
      else if (e.key === 'Escape') hide();
      else if ((e.key === 'Enter' || e.key === ' ') && onPick && cur >= 0) { e.preventDefault(); onPick(cur); }
    });
    f.svg.addEventListener('focus', () => show(cur < 0 ? 0 : cur));
    f.svg.addEventListener('blur', hide);
  }

  /** Stufenlinie einer Toleranzgrenze über die Gänge (Wechsel jeweils mittig zwischen zwei Gängen). */
  function stepSegments(arr, key, xd) {
    const segs = [];
    arr.forEach((t, i) => {
      const v = t[key];
      if (v == null) return;
      const a = i === 0 ? xd[0] : (arr[i - 1].gang + t.gang) / 2;
      const b = i === arr.length - 1 ? xd[1] : (t.gang + arr[i + 1].gang) / 2;
      segs.push({ a, b, v });
    });
    return segs;
  }
  function stepPathD(f, segs, U) {
    let d = '', prev = null;
    for (const sg of segs) {
      const ya = f.y(U(sg.v));
      d += (prev && Math.abs(prev.b - sg.a) < 1e-9 ? `L${f.x(sg.a)},${ya}` : `M${f.x(sg.a)},${ya}`) + `L${f.x(sg.b)},${ya}`;
      prev = sg;
    }
    return d;
  }

  // ------------------------------------------------------------ BCD-Diagramm
  function drawBcd(host, u) {
    const ds = state.ds, res = state.res, show = state.show;
    const catB = ds.chars.filter((c) => c.cls.group === 'bcd' && c.cls.gang != null);
    if (!catB.length) { host.replaceChildren(h('p', { class: 'empty', text: 'Keine BCD-Werte je Gang/KR.' })); return; }
    const overallG = u.summary.bcd.overall && u.summary.bcd.overall.gauss;
    const nominal = u.summary.bcd.nominal ?? catB.find((c) => c.cls.fit === 'gauss')?.nominal ?? catB[0].nominal ?? 0;
    const U = (v) => (v - nominal) * 1000;
    const xd = gangDomain();
    const gangs = [...new Set(catB.map((c) => c.cls.gang))].sort((a, b) => a - b);
    const tol = {};
    for (const fit of FITS) {
      const arr = catB.filter((c) => c.cls.fit === fit).map((c) => ({ gang: c.cls.gang, lsl: c.lsl, usl: c.usl })).sort((a, b) => a.gang - b.gang);
      if (arr.length) tol[fit] = arr;
    }
    const profile = u.summary.bcd.profile;
    const others = show.ctx ? res.order.map((o) => res.units.get(o)).filter((x) => x.included && x.id !== u.id) : [];

    const ys = [0];
    const pushTol = (arr) => arr && arr.forEach((t) => { if (t.lsl != null) ys.push(U(t.lsl)); if (t.usl != null) ys.push(U(t.usl)); });
    if (show.gauss) pushTol(tol.gauss);
    if (show.huell) pushTol(tol.huell);
    if (show.pferch) pushTol(tol.pferch);
    for (const g of profile) {
      if (show.gauss && g.gauss) ys.push(U(g.gauss.stats.min), U(g.gauss.stats.max));
      if (show.huell && g.huell) ys.push(U(g.huell.stats.mean));
      if (show.pferch && g.pferch) ys.push(U(g.pferch.stats.mean));
    }
    for (const o of others) for (const g of o.summary.bcd.profile) if (g.gauss) ys.push(U(g.gauss.stats.mean));
    if (overallG && show.gauss) ys.push(U(overallG.stats.mean));
    const yd = niceDomain(ys, 7);
    const dd = decimalsForStep(yd.step);
    const f = frame(host, {
      height: chartHeight(330), x: xd, y: yd.domain, yTicks: yd.ticks, yFmt: (v) => fmtS(v, dd),
      xTicks: gangs.map((g) => ({ v: g, label: posLabel(g) })), xTitle: isNut() ? '' : 'Gang',
      aria: `BCD über ${isNut() ? 'Kugelrillen' : 'Gang'}, ${unitTitle(u)}`,
    });
    const P = f.plot, k = f.k;

    // Toleranz
    if (tol.gauss && show.gauss) {
      const lo = stepSegments(tol.gauss, 'lsl', xd), hi = stepSegments(tol.gauss, 'usl', xd);
      if (lo.length === tol.gauss.length && hi.length === tol.gauss.length) {
        let d = '';
        hi.forEach((sg, i) => { d += `${i ? 'L' : 'M'}${f.x(sg.a)},${f.y(U(sg.v))}L${f.x(sg.b)},${f.y(U(sg.v))}`; });
        for (let i = lo.length - 1; i >= 0; i--) d += `L${f.x(lo[i].b)},${f.y(U(lo[i].v))}L${f.x(lo[i].a)},${f.y(U(lo[i].v))}`;
        s('path', { d: d + 'Z', class: 'tolband' }, P);
      }
      s('path', { d: stepPathD(f, lo, U), class: 'tolline' }, P);
      s('path', { d: stepPathD(f, hi, U), class: 'tolline' }, P);
    }
    const hpTol = [];
    if (show.huell && tol.huell) hpTol.push(tol.huell);
    if (show.pferch && tol.pferch && !(tol.huell && show.huell && JSON.stringify(tol.huell.map((t) => [t.lsl, t.usl])) === JSON.stringify(tol.pferch.map((t) => [t.lsl, t.usl])))) hpTol.push(tol.pferch);
    for (const arr of hpTol) for (const key of ['lsl', 'usl']) s('path', { d: stepPathD(f, stepSegments(arr, key, xd), U), class: 'tolline2' }, P);
    s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: f.y(0), y2: f.y(0), class: 'zero' }, P);
    if (overallG && show.gauss) {
      const Y = f.y(U(overallG.stats.mean));
      s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: Y, y2: Y, stroke: 'var(--s1)', 'stroke-width': 1.5 * k, 'stroke-dasharray': `${6 * k} ${4 * k}`, opacity: 0.8 }, P);
    }

    // Kontext: andere Aufträge
    for (const o of others) {
      const pts = o.summary.bcd.profile.filter((g) => g.gauss).map((g) => `${f.x(g.gang)},${f.y(U(g.gauss.stats.mean))}`);
      if (pts.length > 1) s('polyline', { points: pts.join(' '), fill: 'none', stroke: 'var(--ctx)', 'stroke-width': 1.5 * k, 'stroke-linejoin': 'round' }, P);
    }
    // Hüll / Pferch
    const fitStyle = { huell: { color: 'var(--s2)', up: true }, pferch: { color: 'var(--s3)', up: false } };
    for (const fit of ['huell', 'pferch']) {
      if (!show[fit]) continue;
      const pts = profile.filter((g) => g[fit]);
      if (pts.length > 1) s('polyline', { points: pts.map((g) => `${f.x(g.gang)},${f.y(U(g[fit].stats.mean))}`).join(' '), fill: 'none', stroke: fitStyle[fit].color, 'stroke-width': 1.5 * k, 'stroke-linejoin': 'round', 'stroke-opacity': 0.85 }, P);
      for (const g of pts) s('path', { d: triPath(f.x(g.gang), f.y(U(g[fit].stats.mean)), 5.5 * k, fitStyle[fit].up), fill: fitStyle[fit].color, stroke: 'var(--surface)', 'stroke-width': 2, 'paint-order': 'stroke' }, P);
    }
    // Gauss
    if (show.gauss) {
      const pts = profile.filter((g) => g.gauss);
      for (const g of pts) {
        const X = f.x(g.gang), y1 = f.y(U(g.gauss.stats.min)), y2 = f.y(U(g.gauss.stats.max));
        s('line', { x1: X, x2: X, y1, y2, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
        s('line', { x1: X - 4 * k, x2: X + 4 * k, y1, y2: y1, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
        s('line', { x1: X - 4 * k, x2: X + 4 * k, y1: y2, y2, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
      }
      if (pts.length > 1) s('polyline', { points: pts.map((g) => `${f.x(g.gang)},${f.y(U(g.gauss.stats.mean))}`).join(' '), fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2 * k, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, P);
      for (const g of pts) s('circle', { cx: f.x(g.gang), cy: f.y(U(g.gauss.stats.mean)), r: 4.5 * k, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }, P);
    }

    // Fadenkreuz
    const byGang = new Map(profile.map((g) => [g.gang, g]));
    const pts = gangs.filter((g) => byGang.has(g));
    crosshair(f, pts.map((g) => ({ x: f.x(g) })), (i) => {
      const g = byGang.get(pts[i]);
      const rows = [], foot = [];
      for (const fit of FITS) {
        const e = g[fit];
        if (!e) continue;
        const st = e.stats, d = dp(e.char);
        rows.push({ key: fit, value: `${fmtS(U(st.mean), 1)} µm`, label: `${C.FIT_LABEL[fit]} x̄ ${fmt(st.mean, Math.min(d + 1, 4))} · ${fmt(st.min, d)}–${fmt(st.max, d)}` });
        foot.push(`${C.FIT_LABEL[fit]} ${e.char.position}: Tol. ${tolText(e.char, d)} · n = ${st.n}${st.below + st.above ? ` · ⚠ ${st.below + st.above} außerhalb` : ''}`);
      }
      if (overallG) foot.push(`Zylinder gesamt ${overallG.char.position}: Gauss x̄ ${fmt(overallG.stats.mean, Math.min(dp(overallG.char) + 1, 4))} (${fmtS(U(overallG.stats.mean), 1)} µm)`);
      return tipBox(posLabel(g.gang, true), rows, foot);
    });
  }

  // ------------------------------------------------------------ Steigungs-Diagramm
  function drawLead(host, u) {
    const ds = state.ds, res = state.res;
    const catL = ds.chars.filter((c) => c.cls.group === 'lead' && c.cls.from != null).sort((a, b) => a.cls.from - b.cls.from || b.cls.turns - a.cls.turns);
    const xd = gangDomain();
    const U = (v, c) => (v - (c.nominal ?? 0)) * 1000;
    const wins = u.summary.lead.windows;
    const others = state.show.ctx ? res.order.map((o) => res.units.get(o)).filter((x) => x.included && x.id !== u.id) : [];
    const ys = [0];
    for (const c of catL) { if (c.lsl != null) ys.push(U(c.lsl, c)); if (c.usl != null) ys.push(U(c.usl, c)); }
    for (const w of wins) ys.push(U(w.stats.min, w.char), U(w.stats.max, w.char));
    for (const o of others) for (const w of o.summary.lead.windows) ys.push(U(w.stats.mean, w.char));
    const yd = niceDomain(ys, 6), dd = decimalsForStep(yd.step);
    const bounds = [...new Set(catL.flatMap((c) => [c.cls.from, c.cls.to]))].sort((a, b) => a - b);
    const f = frame(host, {
      height: chartHeight(isWide() ? 330 : 260), x: xd, y: yd.domain, yTicks: yd.ticks, yFmt: (v) => fmtS(v, dd),
      xTicks: bounds.map((g) => ({ v: g, label: posLabel(g) })), xTitle: isNut() ? '' : 'Gang',
      aria: `Steigung über Gewindelänge, ${unitTitle(u)}`,
    });
    const P = f.plot, k = f.k;
    const tolKey = (c) => `${c.lsl == null ? '' : U(c.lsl, c).toFixed(3)}|${c.usl == null ? '' : U(c.usl, c).toFixed(3)}`;
    const same = new Set(catL.map(tolKey)).size === 1;
    if (same) {
      const c = catL[0], a = f.x(Math.min(...catL.map((k) => k.cls.from))), b = f.x(Math.max(...catL.map((k) => k.cls.to)));
      if (c.lsl != null && c.usl != null) s('rect', { x: a, width: b - a, y: f.y(U(c.usl, c)), height: f.y(U(c.lsl, c)) - f.y(U(c.usl, c)), class: 'tolband' }, P);
      for (const v of [c.lsl, c.usl]) if (v != null) s('line', { x1: a, x2: b, y1: f.y(U(v, c)), y2: f.y(U(v, c)), class: 'tolline' }, P);
    } else {
      for (const c of catL) for (const v of [c.lsl, c.usl]) if (v != null) s('line', { x1: f.x(c.cls.from), x2: f.x(c.cls.to), y1: f.y(U(v, c)), y2: f.y(U(v, c)), class: 'tolline' }, P);
    }
    s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: f.y(0), y2: f.y(0), class: 'zero' }, P);
    for (const o of others) for (const w of o.summary.lead.windows) {
      const Y = f.y(U(w.stats.mean, w.char));
      s('line', { x1: f.x(w.from), x2: f.x(w.to), y1: Y, y2: Y, stroke: 'var(--ctx)', 'stroke-width': 1.5 * k, 'stroke-linecap': 'round' }, P);
    }
    for (const w of wins) {
      const Y = f.y(U(w.stats.mean, w.char)), mid = f.x((w.from + w.to) / 2);
      s('line', { x1: f.x(w.from), x2: f.x(w.to), y1: Y, y2: Y, stroke: 'var(--s1)', 'stroke-width': 2 * k, 'stroke-linecap': 'round' }, P);
      const y1 = f.y(U(w.stats.min, w.char)), y2 = f.y(U(w.stats.max, w.char));
      s('line', { x1: mid, x2: mid, y1, y2, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
      s('line', { x1: mid - 4 * k, x2: mid + 4 * k, y1, y2: y1, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
      s('line', { x1: mid - 4 * k, x2: mid + 4 * k, y1: y2, y2, stroke: 'var(--s1)', 'stroke-width': 1.5 * k }, P);
      s('circle', { cx: mid, cy: Y, r: 4.5 * k, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }, P);
    }
    if (!wins.length) return;
    crosshair(f, wins.map((w) => ({ x: f.x((w.from + w.to) / 2) })), (i) => {
      const w = wins[i], st = w.stats, c = w.char, d = dp(c);
      return tipBox(`${c.cls.label} · ${plGang(w.turns)}${c.cls.turnsDerived ? ' (aus Nennmaß abgeleitet)' : ''}`, [
        { key: 'gauss', value: `${fmtS(U(st.mean, c), 1)} µm`, label: `Länge x̄ ${fmt(st.mean, Math.min(d + 1, 4))} mm` },
        { value: `${fmt(w.pitch, 5)} mm`, label: `Steigung je Gang${w.nominalPitch != null ? ` (Nenn ${fmt(w.nominalPitch, 3)})` : ''}` },
        { value: `${fmt(st.min, d)}–${fmt(st.max, d)}`, label: `Min–Max · s = ${fmt(st.sd, Math.min(d + 1, 4))}` },
      ], `${c.position}: Tol. ${tolText(c, d)} · n = ${st.n}${st.below + st.above ? ` · ⚠ ${st.below + st.above} außerhalb` : ''}`);
    });
  }

  // ------------------------------------------------------------ Batch-Vergleich
  function renderCompare() {
    const sec = $('compareSec'), ds = state.ds;
    const gl = Object.fromEntries(C.GROUPS.map((g) => [g.id, g.label]));
    const sel = h('select', { 'aria-label': 'Merkmal', onchange: (e) => { state.cmp = e.target.value; renderCompare(); } });
    let og = null, ogId = null;
    for (const c of ds.charsGrouped) {
      if (c.cls.sub !== ogId) { og = h('optgroup', { label: gl[c.cls.sub] }); sel.append(og); ogId = c.cls.sub; }
      const o = h('option', { value: c.position, text: `${c.cls.label} (${c.position})` });
      if (c.position === state.cmp) o.selected = true;
      og.append(o);
    }
    const box = h('div', { class: 'chartbox' });
    const c = ds.charMap.get(state.cmp);
    sec.replaceChildren(
      h('div', { class: 'sec-head' },
        h('div', null, h('h2', { text: 'Merkmal im Auftragsvergleich' }), h('p', { class: 'sub', text: 'Alle Einzelwerte je einbezogenem Fertigungsauftrag, Querstrich = Mittelwert. Spalte anklicken = Auftrag auswählen.' })),
        h('div', { class: 'toolbar' }, sel)),
      c ? h('div', { class: 'legend' },
        h('span', { class: 'lg static' }, h('span', { class: 't', text: `${c.cls.label} · ${c.charText} ${c.position} · ${c.unit} · Tol. ${tolText(c, dp(c))}` }))) : null,
      box);
    if (c) drawCompare(box, c);
  }

  function drawCompare(host, c) {
    const res = state.res;
    const units = res.order.map((o) => res.units.get(o)).filter((u) => u.included && u.chars.get(c.position));
    if (!units.length) { host.replaceChildren(h('p', { class: 'empty', text: 'Keine Werte in den einbezogenen Aufträgen.' })); return; }
    const d = dp(c);
    const ys = units.flatMap((u) => u.chars.get(c.position).values);
    if (c.lsl != null) ys.push(c.lsl);
    if (c.usl != null) ys.push(c.usl);
    if (c.lsl == null && c.nominal === 0) ys.push(0);
    const yd = niceDomain(ys, 6);
    const W = Math.max(300, Math.floor(host.clientWidth || 640)), k0 = rootScale();
    const bandW = (W - (62 + 14) * k0) / units.length;
    const rotate = bandW < 70 * k0;
    const f = frame(host, {
      height: chartHeight(rotate ? 330 : 300), ml: 62, mb: rotate ? 72 : 34, x: [0, units.length], y: yd.domain, yTicks: yd.ticks,
      yFmt: (v) => fmt(v, Math.max(decimalsForStep(yd.step), 0)), aria: `${c.cls.label} im Auftragsvergleich`,
    });
    const P = f.plot, k = f.k, cx = (i) => f.x(i + 0.5);
    units.forEach((u, i) => {
      if (state.sel === u.id) s('rect', { x: f.x(i) + 1, width: f.x(i + 1) - f.x(i) - 2, y: f.m.t, height: f.H - f.m.t - f.m.b, fill: 'var(--selwash)', rx: 4 * k }, P);
      const tx = s('text', { class: 'tick', x: cx(i), y: f.H - f.m.b + 16 * k, 'text-anchor': rotate ? 'end' : 'middle', transform: rotate ? `rotate(-40 ${cx(i)} ${f.H - f.m.b + 12 * k})` : null }, f.svg);
      tx.textContent = u.id;
    });
    for (const [v, lab] of [[c.lsl, 'UGW'], [c.usl, 'OGW']]) {
      if (v == null) continue;
      s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: f.y(v), y2: f.y(v), class: 'tolline' }, P);
      s('text', { class: 'ann', x: f.W - f.m.r - 2 * k, y: f.y(v) - 4 * k, 'text-anchor': 'end' }, P).textContent = `${lab} ${fmt(v, d)}`;
    }
    if (c.lsl != null && c.usl != null && c.nominal != null) {
      s('line', { x1: f.m.l, x2: f.W - f.m.r, y1: f.y(c.nominal), y2: f.y(c.nominal), class: 'axis' }, P);
    }
    units.forEach((u, i) => {
      const st = u.chars.get(c.position);
      const hi = state.sel === 'ALL' || state.sel === u.id;
      const spread = Math.min(bandW * 0.28, 22 * k);
      st.values.forEach((v, j) => {
        const jit = (((j * 0.6180339887) % 1) * 2 - 1) * spread;
        s('circle', { cx: cx(i) + jit, cy: f.y(v), r: 3.5 * k, fill: hi ? 'var(--s1)' : 'var(--ctx)', 'fill-opacity': hi ? 0.8 : 1, stroke: 'var(--surface)', 'stroke-width': 1.5 }, P);
      });
      const half = Math.min(bandW * 0.36, 28 * k);
      s('line', { x1: cx(i) - half, x2: cx(i) + half, y1: f.y(st.mean), y2: f.y(st.mean), stroke: 'var(--text2)', 'stroke-width': 2 * k, 'stroke-linecap': 'round' }, P);
    });
    crosshair(f, units.map((u, i) => ({ x: cx(i) })), (i) => {
      const u = units[i], st = u.chars.get(c.position);
      return tipBox(`Auftrag ${u.id} · Charge ${u.batch.batchNo || '–'}`, [
        { key: 'gauss', value: `${fmt(st.mean, Math.min(d + 1, 4))} ${c.unit}`, label: `x̄ · s = ${fmt(st.sd, Math.min(d + 1, 4))}` },
        { value: `${fmt(st.min, d)}–${fmt(st.max, d)}`, label: `Min–Max · n = ${st.n}` },
      ], st.below + st.above ? `⚠ ${st.below + st.above} außerhalb (${st.below} unter UGW, ${st.above} über OGW)` : 'alle Werte in Toleranz');
    }, (i) => select(units[i].id));
  }

  // ------------------------------------------------------------ Kennwerte
  function renderStats() {
    const sec = $('statsSec'), ds = state.ds, u = selUnit();
    const gl = Object.fromEntries(C.GROUPS.map((g) => [g.id, g.label]));
    const body = h('tbody');
    let cur = null, shown = 0;
    const q = state.filter.trim().toLowerCase();
    for (const c of ds.charsGrouped) {
      const st = u.chars.get(c.position);
      if (q && ![c.position, c.cls.label, c.remark, c.charText, gl[c.cls.sub]].some((t) => (t || '').toLowerCase().includes(q))) continue;
      if (state.onlyOut && !(st && st.below + st.above)) continue;
      shown++;
      if (c.cls.sub !== cur) { body.append(h('tr', { class: 'grp' }, h('td', { colspan: 13, text: gl[c.cls.sub] }))); cur = c.cls.sub; }
      const d = dp(c);
      const two = c.lsl != null && c.usl != null && c.nominal != null;
      const dev = st && two ? (c.unit === 'mm' ? `${fmtS(um(st.mean - c.nominal), 1)} µm` : fmtS(st.mean - c.nominal, d + 1)) : '–';
      const out = st ? st.below + st.above : 0;
      body.append(h('tr', {
        class: 'click' + (c.position === state.cmp ? ' sel' : ''), tabindex: 0, title: 'Im Auftragsvergleich zeigen',
        onclick: () => pickChar(c.position), onkeydown: (e) => { if (e.key === 'Enter') pickChar(c.position); },
      },
        h('td', { text: c.position }), h('td', { text: c.cls.label }), h('td', { text: c.unit }),
        h('td', { class: 'num', text: fmt(c.nominal, d) }), h('td', { class: 'num', text: fmt(c.lsl, d) }), h('td', { class: 'num', text: fmt(c.usl, d) }),
        h('td', { class: 'num', text: st ? String(st.n) : '0' }),
        h('td', { class: 'num', text: st ? fmt(st.mean, Math.min(d + 1, 4)) : '–' }),
        h('td', { class: 'num', text: dev }),
        h('td', { class: 'num', text: st ? fmt(st.sd, Math.min(d + 1, 4)) : '–' }),
        h('td', { class: 'num', text: st ? fmt(st.min, d) : '–' }),
        h('td', { class: 'num', text: st ? fmt(st.max, d) : '–' }),
        h('td', { class: 'num' + (out ? ' oot' : ''), text: out ? `⚠ ${out} (↓${st.below} ↑${st.above})` : st ? '0' : '–' }),
      ));
    }
    if (!shown) body.append(h('tr', null, h('td', { colspan: 13, class: 'muted', text: 'Keine Merkmale passen zum Filter.' })));
    const exportBtn = h('button', { class: 'btn', type: 'button', onclick: doExport, text: 'Kennwerte exportieren (CSV)' });
    const search = h('input', { type: 'search', placeholder: 'Filter: Position, Merkmal, Text …', 'aria-label': 'Merkmale filtern', value: state.filter });
    search.addEventListener('input', () => { state.filter = search.value; const pos = search.selectionStart; renderStats(); const n = $('statsSec').querySelector('input[type=search]'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* egal */ } });
    const onlyOut = h('input', { type: 'checkbox', onchange: (e) => { state.onlyOut = e.target.checked; renderStats(); } });
    onlyOut.checked = state.onlyOut;
    const filters = h('div', { class: 'filters' }, search, h('label', null, onlyOut, 'nur Merkmale mit Werten außerhalb Toleranz'), h('span', { class: 'muted', text: `${shown} von ${ds.chars.length} Merkmalen` }));
    sec.replaceChildren(
      h('div', { class: 'sec-head' },
        h('div', null, h('h2', { text: 'Kennwerte' }), h('p', { class: 'sub', text: unitTitle(u) + ' · Zeile anklicken = Merkmal im Auftragsvergleich zeigen' })),
        h('div', { class: 'toolbar' }, exportBtn)),
      filters,
      h('div', { class: 'scroll tall' }, h('table', null,
        h('thead', null, h('tr', null, ['Pos.', 'Merkmal', 'Einheit', 'Nennmaß', 'UGW', 'OGW', 'n', 'x̄', 'x̄ − Nenn', 's', 'Min', 'Max', 'außerhalb'].map((t, i) => h('th', { class: i >= 3 ? 'num' : null, text: t })))),
        body)),
      h('p', { class: 'note', text: 'Export: alle Merkmale, gepoolt und je Auftrag, Semikolon-getrennt mit Dezimalkomma (öffnet direkt in Excel).' }));
  }
  function pickChar(pos) {
    state.cmp = pos;
    renderCompare(); renderStats();
    $('compareSec').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function doExport() {
    const csv = C.exportCSV(state.ds, state.res);
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `${PART[state.ds.partType].label}_Kennwerte_${state.ds.material || 'Material'}_${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ------------------------------------------------------------ Größe
  // Diagramme bei Breiten-/Höhenänderung (Fenster, Zoom, Wechsel des Monitors) neu zeichnen
  let lastKey = '', rt = 0;
  const redraw = () => {
    const key = `${document.querySelector('main').clientWidth}x${window.innerHeight}@${rootScale()}`;
    if (key === lastKey) return;
    lastKey = key;
    clearTimeout(rt);
    rt = setTimeout(() => { if (state.res) { renderProfile(); renderCompare(); } }, 120);
  };
  new ResizeObserver(redraw).observe(document.querySelector('main'));
  window.addEventListener('resize', redraw);

  // Für Tests/Automatisierung: Text direkt laden
  globalThis.SubApp = { loadText: (text, name) => { const p = C.parseCAQ(text, name || 'eingefuegt.csv'); p.encoding = 'Text'; addParsed([p]); }, states, switchPart, get state() { return state; } };
  renderSteps();
})();
</script>
</body>
</html>
